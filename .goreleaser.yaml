version: 2

before:
  hooks:
    # The dashboard SPA (frontend/) must be built before the Go builds
    # below run: internal/backup/webui embeds frontend/'s dist/ output via
    # go:embed, which fails to compile without it (dist/ isn't committed,
    # see .gitignore).
    - sh -c "cd frontend && npm ci && npm run build"

builds:
  - main: ./cmd/go-backup-tool
    binary: go-backup-tool
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X nilswitt.dev/go-backup-tool/internal/version.Version={{.Version}}
      - -X nilswitt.dev/go-backup-tool/internal/version.Commit={{.ShortCommit}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs", "^test", "^ci", "^chore", "^style"]
