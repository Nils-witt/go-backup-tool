# go-backup-tool settings file
#
# A settings file holds the settings that are managed in the web UI and
# stored in the state db: trusted servers, notifications, receivers and the
# report. Use it to keep them in version control or to copy them to another
# instance:
#
#   go-backup-tool -config config.yaml -export-settings settings.yaml
#   go-backup-tool -config config.yaml -import-settings settings.yaml
#
# -export-settings writes every stored setting to the file, readable by its
# owner only, since webhook header values are exported in clear text.
# -import-settings creates every entry that isn't stored yet and updates
# every one that is, by id, exactly as the same change made in the web UI
# would (the same validation applies). It never deletes anything. Sections
# are applied in the order below, each may refer to ids from the ones before
# it, and the import stops at the first invalid entry: entries before it
# stay applied, so fix the file and run it again. Both exit when done; they
# never run jobs.
#
# The notifications:, receivers: and report: sections have the same format
# as the config file's sections of those names, which v8.0.0 removed: to
# keep such a section, move it here and import it. A receiver names the
# trusted servers allowed to send to it under allowed-servers:, replacing
# the removed public-key:.

# trusted-servers: are other go-backup-tool instances allowed to send backups
# to this instance's receivers. id is the sending instance's server UUID
# (shown on its Identity page, and in its data/keys/server.uuid); name is a
# label; public-key is that instance's public key (its data/keys/server.pub),
# which every request from it must be signed with.
# trusted-servers:
#   - id: 6f1c2a4e-8d3b-4c5a-9e7f-0a1b2c3d4e5f
#     name: primary
#     public-key: |
#       -----BEGIN PUBLIC KEY-----
#       ...paste the sending instance's data/keys/server.pub here...
#       -----END PUBLIC KEY-----

# notifications: are named, reusable webhook/email destinations, referenced
# by id from report.notifications: and a receivers: entry's
# stale-notifications:/download-notifications: below, and from a job's
# failure-notifications: in the config file. Each entry needs at
# least one of webhook: or email: — set both to fire both channels for that
# id. webhook.url is the only required field; webhook.method defaults to
# POST, webhook.headers (optional) is a map of header name to value, and
# webhook.body (optional) is the request body — if unset, it defaults to a
# JSON summary of whatever fired it. email.to is the only required field;
# email.from defaults to smtp.username, and email.subject/email.body
# (optional) default to the firing trigger's own text — set them to
# override with the same {placeholder} syntax webhook.body accepts. Every
# trigger's placeholders (stale/download/report, see receivers: and report:
# below) also include {server_name}, the config file's top-level
# server-name:, "" if unset. An email: channel needs the config file's
# smtp: section.
#
# email.encrypt (optional) GPG-encrypts that email's body as OpenPGP/MIME
# (RFC 3156) before sending, so a notification's contents (which may include
# receiver/download detail) aren't readable in transit or sitting in an
# inbox provider — only the subject line stays in the clear, since SMTP/MIME
# headers are never covered by this. encrypt.recipients names the GPG
# identities (fingerprint or email address) to encrypt to; each must already
# have its public key imported into the keyring the top-level
# gpg-bin/gpg-homedir (in the config file) resolve to (`gpg --import their-key.asc`) —
# encrypted emails use the same gpg binary and keyring as backups.
# notifications:
#   - id: ops-email
#     email:
#       to: ["ops@example.com"]
#   - id: ops-email-encrypted
#     email:
#       to: ["ops@example.com"]
#       encrypt:
#         recipients: ["ops@example.com"]
#   - id: pagerduty
#     webhook:
#       url: "https://events.eu.pagerduty.com/v2/enqueue"
#       method: POST
#       headers:
#         Content-Type: application/json
#       body: '{"payload":{"summary":"from-primary backup stale, last file {last_received}","severity":"critical","source":"go-backup-tool"},"routing_key":"replace-with-your-pagerduty-routing-key","event_action":"trigger"}'
#   - id: slack-downloads
#     webhook:
#       url: "https://hooks.slack.com/services/replace-with-your-webhook-path"
#       body: '{"text":"{user} downloaded {file} from {receiver} at {time}"}'

# receivers: are the destination side of another go-backup-tool instance's
# type: remote target (see servers: in config.example.yaml). The receiver API
# is only reachable when the config file sets webui.enabled: true (it's
# served by the same HTTP server as the dashboard), and a receiver's path
# must lie inside the config file's webui.receivers-base-dir:.
#
# Each receiver's id is what a sender's target names as its bucket;
# allowed-servers lists the trusted servers (by id, see trusted-servers:
# above) that may send to it, at least one; path is the root directory
# incoming objects for this id are written under (object ends up at
# path/key, mirroring a local server's path/bucket/key); retention
# (optional, same syntax as a local server's) deletes objects here once
# they're older than that.
#
# stale-after and stale-notifications (optional, set together) monitor this
# receiver for a sender that's stopped showing up: once at least one file has
# been received under path, if the most recent one is older than stale-after
# (same duration syntax as retention), go-backup-tool fires every
# notifications: entry named in stale-notifications (see notifications:
# above). A receiver that has never received anything at all never fires —
# there's no file to be stale — so this only alerts on a sender that
# stopped, not one that never started. It's checked about once a minute and
# fires once per gap, not on every check — a fresh file resets it so it can
# fire again on the next gap.
#
# download-notifications (optional, independent of stale-after/
# stale-notifications) names notifications: entries to fire every time a
# file is successfully downloaded from this receiver through the dashboard.
#
# Both accept the {receiver_id}, {path}, {stale_after}, {last_received} (an
# RFC 3339 timestamp) placeholders (stale-notifications) or {user}, {file},
# {receiver}, {time} (an RFC 3339 timestamp) placeholders
# (download-notifications) in a notification's webhook.body/email.subject/
# email.body — see notifications: above.
# receivers:
#   - id: from-primary
#     allowed-servers: [6f1c2a4e-8d3b-4c5a-9e7f-0a1b2c3d4e5f]
#     path: /mnt/remote-backups/from-primary
#     retention: 30d
#     stale-after: 26h # alert if sibling-instance's daily job hasn't shown up
#     stale-notifications: [pagerduty]
#     download-notifications: [slack-downloads]

# report: configures an optional summary of this instance's receiver
# activity: how many files each configured receivers: entry received since
# the previous report, any receiver API errors, and any receiver currently
# stale (see receivers: above). Independent of webui: — it's sent regardless
# of whether the dashboard is enabled, as long as at least one receivers:
# entry exists to report on. Omit this section entirely (the default) to
# disable it.
# report:
#   enabled: true
#   # schedule: a standard 5-field cron expression (minute hour
#   # day-of-month month day-of-week), always evaluated in UTC regardless
#   # of this machine's time zone (a CRON_TZ=/TZ= prefix is rejected); also
#   # accepts cron's descriptor shorthands (e.g. "@daily", "@every 6h").
#   # Default "0 7 * * *" (once a day at 07:00 UTC).
#   schedule: "0 7 * * *"
#   # notifications: names notifications: entries (see above) to send this
#   # report to. An email: channel receives the full report as its body,
#   # with its subject: (default "go-backup-tool report - {end}")
#   # substituted the same way a stale/download notification's placeholders
#   # are — {start}/{end} are the report window's bounds in UTC, formatted
#   # "2006-01-02 15:04"; {receivers}, {errors}, {stale}, {jobs}, and
#   # {job-errors} are counts of each section. A webhook: channel receives a
#   # JSON summary of the same counts, or its own body: template.
#   notifications: [ops-email]
