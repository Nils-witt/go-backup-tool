  /api/gpg-keys:
    get:
      tags: [admin]
      summary: List GPG public keys
      operationId: listGPGKeys
      description: >
        Every public key in the keyring jobs encrypt to (the config file's
        top-level gpg-bin/gpg-homedir), as gpg reports it. Requires the
        `admin` permission.
      security:
        - webUIBearer: []
      responses:
        "200":
          description: The keyring's public keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GPGKeyList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [admin]
      summary: Add GPG public keys
      operationId: importGPGKeys
      description: >
        Imports the ASCII-armored public key(s) in the body into that
        keyring. Private keys are refused. Since a key carrying a job
        recipient's email address could receive that job's backups, this
        requires `webui.job-editing: true` as well as the `admin`
        permission; the response warns about every email address now on
        more than one usable key.
      security:
        - webUIBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                armored:
                  type: string
                  description: "-----BEGIN PGP PUBLIC KEY BLOCK----- ..."
              required: [armored]
      responses:
        "201":
          description: Keys imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  fingerprints:
                    type: array
                    items:
                      type: string
                  warnings:
                    type: array
                    items:
                      type: string
                required: [fingerprints, warnings]
        "400":
          $ref: "#/components/responses/InvalidSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenOrEditingDisabled"

  /api/v1/objects/{id}/{key}:
    put:
      tags: [receiver-api]
      summary: Write (upload) an object to a receiver
      operationId: putObject
      description: >
        Called by another go-backup-tool instance's `type: remote` target.
        The request body is written to disk exactly as a `type: local`
        target would (atomic temp-file-then-rename), and tracked for
        retention.
      security:
        - receiverBearer: []
      parameters:
        - $ref: "#/components/parameters/ReceiverId"
        - $ref: "#/components/parameters/ObjectKey"
        - name: creationTime
          in: query
          required: false
          description: >
            RFC3339 timestamp of when the backup content was actually
            produced, for retention purposes, rather than upload time. Must
            be strictly before the upload time. Also stamped as the written
            file's mtime.
          schema:
            type: string
            format: date-time
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Object written
        "400":
          description: Invalid object key
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Missing or invalid bearer token
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Unknown receiver id
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Writing the object failed
          content:
            text/plain:
              schema:
                type: string
    delete:
      tags: [receiver-api]
      summary: Delete an object from a receiver
      operationId: deleteObject
      description: The client-facing counterpart to the backup pipeline's remote-delete step.
      security:
        - receiverBearer: []
      parameters:
        - $ref: "#/components/parameters/ReceiverId"
        - $ref: "#/components/parameters/ObjectKey"
      responses:
        "204":
          description: Object deleted
        "400":
          description: Invalid object key
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Missing or invalid bearer token
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Unknown receiver id
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Deleting the object failed
          content:
            text/plain:
              schema:
                type: string

components:
  securitySchemes:
    webUIBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        The OIDC provider's access token (a JWT), obtained by the SPA as a
        public client (authorization code + PKCE). Verified on every request
        against the issuer's JWKS (signature, issuer, expiry) and required to
        name `webui.oidc.client-id` as its `azp` or in its `aud`. Permissions
        are `webui.oidc.default-permissions` plus whatever the token's groups
        map to in `webui.oidc.group-permissions`. Without `webui.oidc`
        enabled, every request is rejected.
    receiverBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Short-lived JWT signed by the sending instance's private key, issued
        by its server id and scoped to the receiver id. Accepted when the
        issuer is one of the receiver's allowed trusted servers and the
        signature verifies against that server's public key, or — for
        receivers predating trusted servers — when it verifies against the
        receiver's deprecated public_key (see
        remoteAuth.SignRemoteAuthToken/VerifyRemoteAuthToken). Independent of
        the dashboard's own SSO auth.

  parameters:
    ReceiverId:
      name: id
      in: path
      required: true
      description: "Receiver id, as managed under Receiver settings in the web UI."
      schema:
        type: string
    ObjectKey:
      name: key
      in: path
      required: true
      description: Object key, relative to the receiver's storage path (may contain "/").
      schema:
        type: string

    ConfigKey:
      name: key
      in: path
      required: true
      description: The job's or server's name, or the command's id.
      schema:
        type: string

  responses:
    Unauthorized:
      description: Missing, invalid, or expired access token
      content:
        text/plain:
          schema:
            type: string
    Forbidden:
      description: Valid access token, but missing the permission this endpoint requires
      content:
        text/plain:
          schema:
            type: string
    InvalidReceiver:
      description: The receiver definition doesn't validate; the body says why
      content:
        text/plain:
          schema:
            type: string
    InvalidTrustedServer:
      description: The trusted server definition doesn't validate (e.g. the id isn't a UUID or the key isn't an RSA PEM public key); the body says why
      content:
        text/plain:
          schema:
            type: string
    InvalidSettings:
      description: The definition doesn't validate; the body says why
      content:
        text/plain:
          schema:
            type: string
    ForbiddenOrEditingDisabled:
      description: Missing the `admin` permission, or `webui.job-editing` isn't enabled in the config file; the body says which
      content:
        text/plain:
          schema:
            type: string
    StateDBUnavailable:
      description: The state db couldn't be opened at startup, so these settings can't be managed
      content:
        text/plain:
          schema:
            type: string

  schemas:
    LiveStatus:
      type: object
      description: One message on the `/api/live` WebSocket.
      properties:
        type:
          type: string
          enum: [status]
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/JobSnapshot"
        receivers:
          type: array
          items:
            $ref: "#/components/schemas/ReceiverSnapshot"
      required: [type, jobs, receivers]
    Permission:
      type: string
      description: >
        A single dashboard capability. `download` implies `view`;
        `admin` implies every other permission.
      enum:
        [
          view,
          download,
          admin,
          login-log,
          download-log,
          job-run-log,
          target-run-log,
          receiver-log,
          audit-log,
        ]

    Meta:
      type: object
      description: Build metadata for the dashboard footer (always public).
      properties:
        version:
          type: string
        commit:
          type: string
      required: [version, commit]

    SSOStatus:
      type: object
      properties:
        enabled:
          type: boolean
        buttonLabel:
          type: string
        issuerUrl:
          type: string
        clientId:
          type: string
        scopes:
          type: string
          description: Space-separated OAuth2 scopes the SPA should request.
      required: [enabled, buttonLabel]

    Me:
      type: object
      properties:
        username:
          type: string
          description: The token's preferred_username, else its email, else its subject.
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        admin:
          type: boolean
          description: True if this user holds the `admin` permission.
      required: [username, permissions, admin]

    JobRunEvent:
      type: object
      properties:
        job_name:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        success:
          type: boolean
        size:
          type: integer
          format: int64
        error:
          type: string
      required: [job_name, start, end, success, size]

    TargetRunEvent:
      type: object
      properties:
        at:
          type: string
          format: date-time
        job_name:
          type: string
        target:
          type: string
        success:
          type: boolean
        state:
          $ref: "#/components/schemas/RunState"
        error:
          type: string
      required: [at, job_name, target, success, state]

    ReceiverEvent:
      type: object
      properties:
        at:
          type: string
          format: date-time
        receiver_id:
          type: string
        kind:
          type: string
          description: Which receiver API request this was.
          enum: [receive, delete]
        key:
          type: string
        size:
          type: integer
          format: int64
        success:
          type: boolean
        error:
          type: string
      required: [at, receiver_id, kind, key, size, success]

    AuditEvent:
      type: object
      properties:
        at:
          type: string
          format: date-time
        username:
          type: string
          description: The signed-in user that made the change.
        action:
          type: string
          description: >
            What was done: `create`, `update`, `delete`, or a route's own
            verb (e.g. `retry`).
        resource:
          type: string
          description: The API collection changed, e.g. `receiver-configs`.
        target:
          type: string
          description: The changed item's id, name, or key; empty if unknown.
        method:
          type: string
        path:
          type: string
        status:
          type: integer
          description: The HTTP response status.
        success:
          type: boolean
        remote_addr:
          type: string
        detail:
          type: string
          description: The error response's text; empty on success.
      required: [at, username, action, resource, target, method, path, status, success, remote_addr, detail]

    RunState:
      type: string
      description: >
        idle: never run yet. running: currently executing. ok: last run
        succeeded. incomplete: job only — succeeded on some targets, not
        all. failed: last run failed.
      enum: [idle, running, ok, incomplete, failed]

    TargetSnapshot:
      type: object
      properties:
        server:
          type: string
        server_uuid:
          type: string
          format: uuid
          description: A remote server's configured server UUID; omitted when unset.
        bucket:
          type: string
        kind:
          type: string
        state:
          $ref: "#/components/schemas/RunState"
        error:
          type: string
      required: [server, bucket, kind, state]

    JobSnapshot:
      type: object
      properties:
        name:
          type: string
        interval:
          type: string
        state:
          $ref: "#/components/schemas/RunState"
        last_start:
          type: string
          format: date-time
        last_end:
          type: string
          format: date-time
        next_run:
          type: string
          format: date-time
          description: Zero time if not (yet) scheduled, e.g. a one-shot job that already ran.
        duration:
          type: string
        size:
          type: string
          description: Encrypted object size from the last successful run; sticky across a later failure.
        error:
          type: string
        targets:
          type: array
          items:
            $ref: "#/components/schemas/TargetSnapshot"
      required: [name, state, last_start, last_end, next_run, targets]

    Identity:
      type: object
      properties:
        uuid:
          type: string
        public_key:
          type: string
          description: PEM-encoded public key.
        fingerprint:
          type: string
          description: The public key's SHA-256 fingerprint, OpenSSH-style ("SHA256:...").
      required: [uuid, public_key, fingerprint]

    ReceiverSnapshot:
      type: object
      properties:
        id:
          type: string
        path:
          type: string
        retention:
          type: string
        state:
          allOf:
            - $ref: "#/components/schemas/RunState"
          description: idle until the first object is received.
        last_key:
          type: string
        last_seen:
          type: string
          format: date-time
          description: Zero time if nothing has been received yet.
        error:
          type: string
        stale_after:
          type: string
          description: "Set only when this receiver has stale-after: configured."
        stale:
          type: boolean
          description: True once the most recent file is older than stale_after.
      required: [id, path, state, last_seen]

    ReceiverFile:
      type: object
      properties:
        key:
          type: string
        size:
          type: integer
          format: int64
        mod_time:
          type: string
          format: date-time
      required: [key, size, mod_time]

    LoginEvent:
      type: object
      properties:
        at:
          type: string
          format: date-time
        username:
          type: string
        method:
          type: string
          enum: [password, oidc]
        success:
          type: boolean
        remote_addr:
          type: string
        detail:
          type: string
          description: Failure reason; empty on success.
      required: [at, username, method, success, remote_addr]

    DownloadEvent:
      type: object
      properties:
        at:
          type: string
          format: date-time
        username:
          type: string
        receiver_id:
          type: string
        key:
          type: string
        success:
          type: boolean
        remote_addr:
          type: string
        detail:
          type: string
          description: Failure reason; empty on success.
      required: [at, username, receiver_id, key, success, remote_addr]

    ReceiverConfigInput:
      type: object
      properties:
        id:
          type: string
          description: What the sender's remote target names as its bucket. Immutable once created.
        allowed_servers:
          type: array
          items:
            type: string
            format: uuid
          description: Ids of the trusted servers allowed to send to this receiver.
        public_key:
          type: string
          description: >
            Deprecated: PEM-encoded RSA public key of a single sending
            instance, accepted from any issuer. Kept for receivers predating
            trusted servers; send "" to remove it.
        path:
          type: string
          description: Absolute directory incoming objects are written under.
        retention:
          type: string
          description: Optional, e.g. "30d" or "12h"; empty keeps objects forever.
        stale_after:
          type: string
          description: Optional, e.g. "26h"; set together with stale_notifications.
        stale_notifications:
          type: array
          items:
            type: string
          description: Notification ids fired once per gap when the receiver turns stale.
        download_notifications:
          type: array
          items:
            type: string
          description: Notification ids fired on every dashboard download from this receiver.
      required: [id, path]
      description: >
        A receiver's editable fields, with the same syntax as the former
        `receivers:` config entries. At least one of allowed_servers or
        public_key must be set.

    ReceiverConfig:
      allOf:
        - $ref: "#/components/schemas/ReceiverConfigInput"
        - type: object
          properties:
            created_at:
              type: string
              format: date-time
            created_by:
              type: string
              description: Username, or "config file" for an imported receiver.
            updated_at:
              type: string
              format: date-time
            updated_by:
              type: string
            error:
              type: string
              description: Set when the stored receiver no longer validates (e.g. it names a removed notification) and so is inactive.
          required: [created_at, created_by, updated_at, updated_by]

    ReceiverConfigList:
      type: object
      properties:
        base_dir:
          type: string
          description: "`webui.receivers-base-dir`; empty when unset, in which case receivers can't be created or moved."
        notifications:
          type: array
          items:
            type: string
          description: Notification ids defined in the config file.
        trusted_servers:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
            required: [id, name]
          description: Active trusted servers a receiver may allow.
        receivers:
          type: array
          items:
            $ref: "#/components/schemas/ReceiverConfig"
      required: [base_dir, notifications, trusted_servers, receivers]

    TrustedServerInput:
      type: object
      description: A trusted server's editable fields.
      properties:
        id:
          type: string
          format: uuid
          description: The sending instance's server id (its UUID, shown on its Identity page). Immutable once created.
        name:
          type: string
          description: Label to tell servers apart.
        public_key:
          type: string
          description: PEM-encoded RSA public key of the sending instance (its server.pub).
      required: [id, name, public_key]

    TrustedServer:
      allOf:
        - $ref: "#/components/schemas/TrustedServerInput"
        - type: object
          properties:
            fingerprint:
              type: string
              description: The public key's SHA-256 fingerprint, OpenSSH-style ("SHA256:...").
            used_by:
              type: array
              items:
                type: string
              description: The receivers allowing this server, as "receiver <id>".
            created_at:
              type: string
              format: date-time
            created_by:
              type: string
            updated_at:
              type: string
              format: date-time
            updated_by:
              type: string
            error:
              type: string
              description: Set when the stored server no longer validates and so is inactive.
          required: [fingerprint, used_by, created_at, created_by, updated_at, updated_by]

    TrustedServerList:
      type: object
      properties:
        servers:
          type: array
          items:
            $ref: "#/components/schemas/TrustedServer"
      required: [servers]

    WebhookConfig:
      type: object
      properties:
        url:
          type: string
          description: Absolute http(s) URL.
        method:
          type: string
          description: Defaults to POST.
        headers:
          type: object
          additionalProperties:
            type: string
            nullable: true
          description: >
            Header name to value. Values are write-only: listed as null; on
            update, null keeps the stored value.
        body:
          type: string
          description: Empty sends the trigger's default JSON summary.
      required: [url]

    EmailConfig:
      type: object
      properties:
        to:
          type: array
          items:
            type: string
        from:
          type: string
          description: Empty uses smtp.username.
        subject:
          type: string
        body:
          type: string
        encrypt:
          type: object
          nullable: true
          properties:
            recipients:
              type: array
              items:
                type: string
          required: [recipients]
      required: [to]

    NotificationConfigInput:
      type: object
      description: At least one of webhook and email must be set.
      properties:
        id:
          type: string
          description: Immutable once created.
        webhook:
          type: object
          allOf:
            - $ref: "#/components/schemas/WebhookConfig"
          nullable: true
        email:
          type: object
          allOf:
            - $ref: "#/components/schemas/EmailConfig"
          nullable: true
      required: [id]

    NotificationConfig:
      allOf:
        - $ref: "#/components/schemas/NotificationConfigInput"
        - type: object
          properties:
            created_at:
              type: string
              format: date-time
            created_by:
              type: string
              description: Username, or "config file" for an imported notification.
            updated_at:
              type: string
              format: date-time
            updated_by:
              type: string
            error:
              type: string
              description: Set when the stored notification no longer validates (e.g. email without smtp:) and so is inactive.
            used_by:
              type: array
              items:
                type: string
              description: 'What references it: "job <name>", "receiver <id>", or "report".'
          required: [created_at, created_by, updated_at, updated_by, used_by]

    NotificationConfigList:
      type: object
      properties:
        smtp_configured:
          type: boolean
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/NotificationConfig"
      required: [smtp_configured, notifications]

    ReportConfigInput:
      type: object
      properties:
        enabled:
          type: boolean
        schedule:
          type: string
          description: 5-field cron expression or descriptor, evaluated in UTC; empty uses the default.
        notifications:
          type: array
          items:
            type: string
          description: Notification ids; required when enabled.
      required: [enabled]

    ReportConfig:
      allOf:
        - $ref: "#/components/schemas/ReportConfigInput"
        - type: object
          properties:
            updated_at:
              type: string
              format: date-time
              nullable: true
            updated_by:
              type: string
            error:
              type: string
              description: Set when the stored settings no longer validate; the report is then off.
            default_schedule:
              type: string
            next_run:
              type: string
              format: date-time
              nullable: true
            notification_ids:
              type: array
              items:
                type: string
          required: [schedule, notifications, updated_by, default_schedule, notification_ids]

    JobTarget:
      type: object
      description: One of a job's targets, with the same syntax as a former `targets:` config entry.
      properties:
        server:
          type: string
          description: A server's name.
        bucket:
          type: string
          description: Subdirectory on a local server; the receiver id on a remote one.
        retention:
          type: string
          description: Overrides a local server's retention for this job, e.g. "30d". Empty keeps the server's.
        on_error:
          type: object
          nullable: true
          properties:
            command:
              type: string
              description: A command's id.
            after:
              type: integer
              minimum: 1
              description: Consecutive failures before it first runs.
            repeat:
              type: boolean
              nullable: true
              description: false runs it only once per failure streak; default true.
          required: [command, after]
        on_recover:
          type: object
          nullable: true
          properties:
            command:
              type: string
          required: [command]
      required: [server, bucket]

    JobConfigInput:
      type: object
      description: >
        A job's editable fields, with the same syntax as a former `jobs:`
        config entry. Unlike the config file, there are no shared top-level
        defaults besides gpg-bin/gpg-homedir.
      properties:
        name:
          type: string
          description: Immutable once created; the job's run history is keyed by it.
        cmd:
          type: string
          description: Shell command whose standard output is the backup.
        key:
          type: string
          description: Object key; "{time}" becomes the run's UTC timestamp. Empty means "backup-{time}.gpg".
        targets:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/JobTarget"
        recipients:
          type: array
          minItems: 1
          items:
            type: string
          description: GPG identities to encrypt to.
        armor:
          type: boolean
        gpg_bin:
          type: string
          description: Empty uses the config file's gpg-bin.
        gpg_homedir:
          type: string
          description: Empty uses the config file's gpg-homedir.
        interval:
          type: string
          description: Repeat interval, e.g. "6h". Empty runs once.
        start_time:
          type: string
          description: RFC 3339 time anchoring the interval grid; requires interval.
        staging_dir:
          type: string
        failure_notifications:
          type: array
          items:
            type: string
          description: Notification ids fired whenever a run fails on any target.
      required: [name, cmd, targets, recipients]

    JobConfig:
      allOf:
        - $ref: "#/components/schemas/JobConfigInput"
        - type: object
          properties:
            created_at:
              type: string
              format: date-time
            created_by:
              type: string
              description: Username, or "config file" when imported or read from it (times are then zero).
            updated_at:
              type: string
              format: date-time
            updated_by:
              type: string
            error:
              type: string
              description: Set when the stored job doesn't validate (e.g. it names a removed server) and so isn't scheduled.
          required: [created_at, created_by, updated_at, updated_by]

    JobConfigList:
      type: object
      properties:
        editing:
          type: boolean
          description: Whether `webui.job-editing` is on; off, everything here comes from the config file and is read-only.
        servers:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              type:
                type: string
                enum: [local, remote]
            required: [name, type]
          description: Active servers a job's targets may name.
        commands:
          type: array
          items:
            type: string
          description: Active command ids a target's on_error/on_recover may name.
        notifications:
          type: array
          items:
            type: string
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/JobConfig"
      required: [editing, servers, commands, notifications, jobs]

    ServerConfigInput:
      type: object
      description: An upload destination, with the same syntax as a former `servers:` config entry.
      properties:
        name:
          type: string
          description: Immutable once created.
        type:
          type: string
          enum: [local, remote]
        endpoint:
          type: string
          description: Remote only; the other instance's base URL.
        server_uuid:
          type: string
          format: uuid
          description: Remote only, optional; the other instance's server UUID, as shown on its Identity page.
        path:
          type: string
          description: Local only; root directory backups are written under.
        retention:
          type: string
          description: Local only, e.g. "7d". Empty keeps objects forever.
      required: [name, type]

    ServerConfig:
      allOf:
        - $ref: "#/components/schemas/ServerConfigInput"
        - type: object
          properties:
            created_at:
              type: string
              format: date-time
            created_by:
              type: string
              description: Username, or "config file" when imported or read from it (times are then zero).
            updated_at:
              type: string
              format: date-time
            updated_by:
              type: string
            used_by:
              type: array
              items:
                type: string
              description: The jobs whose targets name it, as "job <name>".
            error:
              type: string
          required: [created_at, created_by, updated_at, updated_by, used_by]

    ServerConfigList:
      type: object
      properties:
        editing:
          type: boolean
        servers:
          type: array
          items:
            $ref: "#/components/schemas/ServerConfig"
      required: [editing, servers]

    CommandConfigInput:
      type: object
      description: An on-error/on-recover shell command, with the same syntax as a former `commands:` config entry.
      properties:
        id:
          type: string
          description: Immutable once created.
        cmd:
          type: string
        timeout:
          type: string
          description: e.g. "15s". Empty means 30s.
      required: [id, cmd]

    CommandConfig:
      allOf:
        - $ref: "#/components/schemas/CommandConfigInput"
        - type: object
          properties:
            created_at:
              type: string
              format: date-time
            created_by:
              type: string
              description: Username, or "config file" when imported or read from it (times are then zero).
            updated_at:
              type: string
              format: date-time
            updated_by:
              type: string
            used_by:
              type: array
              items:
                type: string
              description: The jobs whose targets run it, as "job <name>".
            error:
              type: string
          required: [created_at, created_by, updated_at, updated_by, used_by]

    CommandConfigList:
      type: object
      properties:
        editing:
          type: boolean
        commands:
          type: array
          items:
            $ref: "#/components/schemas/CommandConfig"
      required: [editing, commands]

    GPGKey:
      type: object
      properties:
        fingerprint:
          type: string
        key_id:
          type: string
        algorithm:
          type: string
          description: e.g. "RSA" or "EdDSA ed25519".
        length:
          type: integer
        created:
          type: string
          format: date-time
        expires:
          type: string
          format: date-time
          description: Absent when the key doesn't expire.
        user_ids:
          type: array
          items:
            type: string
          description: Its user IDs, revoked ones left out.
        revoked:
          type: boolean
        expired:
          type: boolean
        disabled:
          type: boolean
        can_encrypt:
          type: boolean
          description: Whether the key (or a subkey) can currently encrypt, as a job recipient needs.
      required: [fingerprint, key_id, algorithm, length, created, user_ids, revoked, expired, disabled, can_encrypt]

    GPGKeyList:
      type: object
      properties:
        homedir:
          type: string
          description: The keyring's gpg-homedir; empty for gpg's default.
        editing:
          type: boolean
          description: Whether keys may be added (`webui.job-editing`).
        keys:
          type: array
          items:
            $ref: "#/components/schemas/GPGKey"
      required: [homedir, editing, keys]
