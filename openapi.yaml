openapi: 3.0.3
info:
  title: go-backup-tool API
  description: >
    HTTP surface exposed by go-backup-tool's web UI process: the dashboard's
    read-only JSON endpoints (status, receiver state, logs, audit events) and
    the receiver API that another go-backup-tool instance's `type: remote`
    targets write objects to. Both are served from the same listen address
    (see `-listen` / `webui:` in the config file).
  version: "1.0"
servers:
  - url: http://localhost:8080
    description: Default web UI listen address (configurable via -listen / webui.listen)

tags:
  - name: dashboard
    description: Read-only JSON endpoints backing the web UI dashboard
  - name: auth
    description: Dashboard SSO (OpenID Connect) — the SPA logs in as a public client and sends the provider's access token as a bearer token
  - name: admin
    description: Actions requiring the `admin` permission
  - name: receiver-api
    description: "Object ingestion API for `type: remote` targets, authenticated per-receiver via a signed JWT bearer token"

paths:
  /api/meta:
    get:
      tags: [dashboard]
      summary: Build metadata for the dashboard footer
      operationId: getMeta
      description: >
        Always public/unauthenticated, since the footer is shown on the
        login page too.
      security: []
      responses:
        "200":
          description: Build metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"

  /api/sso/status:
    get:
      tags: [auth]
      summary: Public SSO settings for the login page
      operationId: getSSOStatus
      description: >
        Always public/unauthenticated: the login page needs this before any
        credential exists, to run the OIDC authorization-code + PKCE flow
        itself as a public client. The provider fields are only present
        while `webui.oidc.enabled` is true; none of them are secret.
      security: []
      responses:
        "200":
          description: SSO settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SSOStatus"

  /api/me:
    get:
      tags: [auth]
      summary: The signed-in user's identity and permissions
      operationId: getMe
      description: >
        Everything the dashboard's own JavaScript needs to decide which
        sections to show; the server-side handlers behind those sections
        enforce the same rules independently on every actual request. Only
        requires a valid access token, not any specific permission. Records
        nothing — see `POST /api/sso/login`.
      security:
        - webUIBearer: []
      responses:
        "200":
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/sso/login:
    post:
      tags: [auth]
      summary: Record a completed SSO login
      operationId: ssoLogin
      description: >
        The server takes no part in the login itself, so the SPA calls this
        exactly once after the provider's redirect back, to record the
        sign-in in the login log. Returns the same body as `GET /api/me`.
      security:
        - webUIBearer: []
      responses:
        "200":
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/status:
    get:
      tags: [dashboard]
      summary: Current job/target statuses
      operationId: getStatus
      description: >
        Snapshot of every configured backup job and its targets. The
        dashboard follows `/api/live` instead and only polls this as a
        fallback. Requires the `view` permission.
      security:
        - webUIBearer: []
      responses:
        "200":
          description: Job statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/logs:
    get:
      tags: [dashboard]
      summary: Recent log lines
      operationId: getLogs
      description: >
        The most recent buffered log lines (see `enable-log-viewer:` in the
        config file), oldest first. Requires the `view` permission.
      security:
        - webUIBearer: []
      responses:
        "200":
          description: Buffered log lines
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/identity:
    get:
      tags: [dashboard]
      summary: This instance's server identity
      operationId: getIdentity
      description: >
        This instance's persistent UUID (its server id) and PEM-encoded
        public key plus that key's fingerprint, used to add this instance as
        a trusted server on another instance. A zero-value object is returned
        if no identity was loaded at startup. Requires the `view`
        permission.
      security:
        - webUIBearer: []
      responses:
        "200":
          description: Server identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/receivers:
    get:
      tags: [dashboard]
      summary: Current receiver statuses
      operationId: getReceivers
      description: >
        Live state of every configured receiver, annotated with staleness
        for any receiver with `stale-after:` set. Requires the `view`
        permission.
      security:
        - webUIBearer: []
      responses:
        "200":
          description: Receiver statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReceiverSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/live/ticket:
    post:
      tags: [dashboard]
      summary: Mint a one-time ticket for the live status WebSocket
      operationId: mintLiveTicket
      description: >
        Mints a short-lived (60s), single-use ticket for opening
        `GET /api/live`, since a browser can't attach an `Authorization`
        header to a WebSocket handshake. Requires the `view` permission.
      security:
        - webUIBearer: []
      responses:
        "200":
          description: Live status ticket
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket:
                    type: string
                required: [ticket]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/live:
    get:
      tags: [dashboard]
      summary: Live job/target/receiver status (WebSocket)
      operationId: getLiveStatus
      description: >
        Upgrades to a WebSocket that pushes a `LiveStatus` JSON text message
        once on connect, whenever a job, target or receiver changes state
        (bursts are merged into one message), and at least every 30s.
        Each message carries the full current state — the same data as
        `/api/status` and `/api/receivers` — so clients simply replace what
        they have. Clients must not send data messages; one closes the
        connection. Authorized by a one-time ticket from
        `POST /api/live/ticket` rather than a bearer token. The server
        closes the socket with status 1001 (going away) when it shuts down.
      security: []
      parameters:
        - name: ticket
          in: query
          required: true
          description: A ticket minted by `POST /api/live/ticket`.
          schema:
            type: string
      responses:
        "101":
          description: Switching to the WebSocket protocol; messages are `LiveStatus` objects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveStatus"
        "403":
          description: Missing, invalid, expired, or already-used live status ticket
          content:
            text/plain:
              schema:
                type: string

  /api/job-runs:
    get:
      tags: [dashboard]
      summary: Historical job run log
      operationId: getJobRunEvents
      description: >
        The most recently recorded job runs (up to
        `webui.event-log-limit:`, default 200) across every job, newest
        first. Requires the `job-run-log` permission, independent of
        `view`.
      security:
        - webUIBearer: []
      responses:
        "200":
          description: Job run events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobRunEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/target-runs:
    get:
      tags: [dashboard]
      summary: Historical job target run log
      operationId: getTargetRunEvents
      description: >
        The most recently recorded job target runs (up to
        `webui.event-log-limit:`, default 200) across every job, newest
        first. Requires the `target-run-log` permission, independent of
        `view`.
      security:
        - webUIBearer: []
      responses:
        "200":
          description: Target run events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TargetRunEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/jobs/{name}/retry:
    post:
      tags: [admin]
      summary: Retry a job's currently failed targets
      operationId: retryFailedTargets
      description: >
        Kicks off a re-run of the named job's pipeline for whichever of its
        targets `/api/status` currently reports as failed (re-running the
        whole pipeline, not just re-uploading). Starts the retry in the
        background and returns immediately; follow `/api/live` (or poll
        `/api/status`) for progress. Requires the `admin` permission.
      security:
        - webUIBearer: []
      parameters:
        - name: name
          in: path
          required: true
          description: Job name, as configured under `jobs:` in the config file.
          schema:
            type: string
      responses:
        "202":
          description: Retry started
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Unknown job name
          content:
            text/plain:
              schema:
                type: string
        "409":
          description: No failed targets to retry
          content:
            text/plain:
              schema:
                type: string

  /api/receivers/{id}/files:
    get:
      tags: [dashboard]
      summary: Files currently stored under a receiver
      operationId: getReceiverFiles
      description: Requires the `view` permission.
      security:
        - webUIBearer: []
      parameters:
        - $ref: "#/components/parameters/ReceiverId"
      responses:
        "200":
          description: Objects currently stored under this receiver's path
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReceiverFile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Unknown receiver id
          content:
            text/plain:
              schema:
                type: string

  /api/receivers/{id}/download/{key}:
    post:
      tags: [dashboard]
      summary: Mint a one-time download ticket for a file stored under a receiver
      operationId: mintDownloadTicket
      description: >
        Mints a short-lived (60s), single-use download ticket for this
        receiver/key, attributed to whoever is currently logged in. The
        dashboard's own JavaScript calls this (bearer-authenticated) right
        before navigating the browser to the matching GET below, which — as
        a plain page navigation — can't carry an Authorization header.
        Requires the `download` permission (which implies `view`).
      security:
        - webUIBearer: []
      parameters:
        - $ref: "#/components/parameters/ReceiverId"
        - name: key
          in: path
          required: true
          description: Object key, relative to the receiver's storage path (may contain "/").
          schema:
            type: string
      responses:
        "200":
          description: Download ticket
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket:
                    type: string
                required: [ticket]
        "400":
          description: Invalid object key
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Unknown receiver id
          content:
            text/plain:
              schema:
                type: string
    get:
      tags: [dashboard]
      summary: Download a file stored under a receiver
      operationId: downloadReceiverFile
      description: >
        Streams the raw content of one object. Authorized by a one-time
        ticket (see the POST operation above) rather than a bearer token,
        since this request is a plain browser navigation.
      security: []
      parameters:
        - $ref: "#/components/parameters/ReceiverId"
        - name: key
          in: path
          required: true
          description: Object key, relative to the receiver's storage path (may contain "/").
          schema:
            type: string
        - name: ticket
          in: query
          required: true
          description: A ticket minted by POSTing to this same path.
          schema:
            type: string
      responses:
        "200":
          description: File content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid object key
          content:
            text/plain:
              schema:
                type: string
        "403":
          description: Missing, invalid, expired, or already-used download ticket
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Unknown receiver id, or file not found
          content:
            text/plain:
              schema:
                type: string

  /api/login-events:
    get:
      tags: [dashboard]
      summary: Recent dashboard login attempts
      operationId: getLoginEvents
      description: >
        The most recently recorded login attempts (up to
        `webui.event-log-limit:`, default 200), newest first. Requires
        the `login-log` permission, independent of `view`.
      security:
        - webUIBearer: []
      responses:
        "200":
          description: Login events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LoginEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/download-events:
    get:
      tags: [dashboard]
      summary: Recent file download attempts
      operationId: getDownloadEvents
      description: >
        The most recently recorded download attempts (up to
        `webui.event-log-limit:`, default 200), newest first. Requires
        the `download-log` permission, independent of `view`/`download`.
      security:
        - webUIBearer: []
      responses:
        "200":
          description: Download events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DownloadEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/receiver-events:
    get:
      tags: [dashboard]
      summary: Recent receiver API requests
      operationId: getReceiverEvents
      description: >
        The most recently recorded receiver API requests (PUT or DELETE, up
        to `webui.event-log-limit:`, default 200) across every receiver, win
        or lose, newest first. Requires the `receiver-log` permission,
        independent of `view`.
      security:
        - webUIBearer: []
      responses:
        "200":
          description: Receiver events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReceiverEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/audit-events:
    get:
      tags: [dashboard]
      summary: Recent configuration changes
      operationId: getAuditEvents
      description: >
        The most recently recorded changes made through the web UI's API
        (up to `webui.event-log-limit:`, default 200), win or lose, newest
        first: creating, updating, or deleting a stored job, server,
        command, receiver, trusted server, notification, report setting,
        API token, or GPG key, and retrying a job's failed targets. Request
        bodies are never recorded. Requires the `audit-log` permission,
        independent of `view`.
      security:
        - webUIBearer: []
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/receiver-configs:
    get:
      tags: [admin]
      summary: List stored receivers
      operationId: listReceiverConfigs
      description: >
        Every receiver stored in the state db (the only source of receivers;
        the config file's deprecated `receivers:` entries are imported once
        at startup), as entered, plus the base directory receiver paths must
        lie inside (`webui.receivers-base-dir`, empty if unset), the
        notification ids, and the trusted servers a receiver may reference.
        Requires the `admin` permission.
      security:
        - webUIBearer: []
      responses:
        "200":
          description: Stored receivers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiverConfigList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/StateDBUnavailable"
    post:
      tags: [admin]
      summary: Create a receiver
      operationId: createReceiverConfig
      description: >
        Validates and stores a new receiver and activates it immediately —
        the receiver API accepts uploads for it without a restart. `path`
        must lie inside `webui.receivers-base-dir`. Requires the `admin`
        permission.
      security:
        - webUIBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiverConfigInput"
      responses:
        "201":
          description: Receiver created
        "400":
          $ref: "#/components/responses/InvalidReceiver"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A receiver with this id already exists
          content:
            text/plain:
              schema:
                type: string
        "503":
          $ref: "#/components/responses/StateDBUnavailable"

  /api/receiver-configs/{id}:
    parameters:
      - $ref: "#/components/parameters/ReceiverId"
    put:
      tags: [admin]
      summary: Update a receiver
      operationId: updateReceiverConfig
      description: >
        Replaces the receiver's definition and applies it immediately. The
        id can't be changed (a body `id`, if given, must match the path). A
        changed `path` must lie inside `webui.receivers-base-dir`; an
        unchanged one is kept even if it doesn't (e.g. one imported from the
        config file). Requires the `admin` permission.
      security:
        - webUIBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiverConfigInput"
      responses:
        "204":
          description: Receiver updated
        "400":
          $ref: "#/components/responses/InvalidReceiver"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Unknown receiver id
          content:
            text/plain:
              schema:
                type: string
        "503":
          $ref: "#/components/responses/StateDBUnavailable"
    delete:
      tags: [admin]
      summary: Delete a receiver
      operationId: deleteReceiverConfig
      description: >
        Removes the receiver; its senders are rejected from then on. Files
        already received, and the receiver's history, are kept. Requires the
        `admin` permission.
      security:
        - webUIBearer: []
      responses:
        "204":
          description: Receiver deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Unknown receiver id
          content:
            text/plain:
              schema:
                type: string
        "503":
          $ref: "#/components/responses/StateDBUnavailable"

  /api/trusted-servers:
    get:
      tags: [admin]
      summary: List trusted servers
      operationId: listTrustedServers
      description: >
        Every remote instance this one accepts receiver API requests from,
        keyed by that instance's server id (its UUID, the issuer of every
        request token it signs), with its public key, the key's
        fingerprint, and the receivers allowing it. Requires the `admin`
        permission.
      security:
        - webUIBearer: []
      responses:
        "200":
          description: Trusted servers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustedServerList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/StateDBUnavailable"
    post:
      tags: [admin]
      summary: Add a trusted server
      operationId: createTrustedServer
      description: >
        Validates and stores a new trusted server. It takes effect once a
        receiver allows it. Requires the `admin` permission.
      security:
        - webUIBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrustedServerInput"
      responses:
        "201":
          description: Trusted server created
        "400":
          $ref: "#/components/responses/InvalidTrustedServer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A trusted server with this id already exists
          content:
            text/plain:
              schema:
                type: string
        "503":
          $ref: "#/components/responses/StateDBUnavailable"

  /api/trusted-servers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Trusted server id (the sending instance's UUID).
        schema:
          type: string
          format: uuid
    put:
      tags: [admin]
      summary: Update a trusted server
      operationId: updateTrustedServer
      description: >
        Replaces the trusted server's name and public key (e.g. after the
        sending instance's key pair was regenerated); every receiver allowing
        it verifies against the new key from the next request on. The id
        can't be changed (a body `id`, if given, must match the path).
        Requires the `admin` permission.
      security:
        - webUIBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrustedServerInput"
      responses:
        "204":
          description: Trusted server updated
        "400":
          $ref: "#/components/responses/InvalidTrustedServer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Unknown trusted server id
          content:
            text/plain:
              schema:
                type: string
        "503":
          $ref: "#/components/responses/StateDBUnavailable"
    delete:
      tags: [admin]
      summary: Delete a trusted server
      operationId: deleteTrustedServer
      description: >
        Removes the trusted server. Refused while any receiver still allows
        it. Requires the `admin` permission.
      security:
        - webUIBearer: []
      responses:
        "204":
          description: Trusted server deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Unknown trusted server id
          content:
            text/plain:
              schema:
                type: string
        "409":
          description: Still allowed by a receiver (the message names them)
          content:
            text/plain:
              schema:
                type: string
        "503":
          $ref: "#/components/responses/StateDBUnavailable"

  /api/notification-configs:
    get:
      tags: [admin]
      summary: List stored notifications
      operationId: listNotificationConfigs
      description: >
        Every notification stored in the state db (the only source of
        notifications; the config file's deprecated `notifications:` is
        imported once at startup), with what references each one and
        whether `smtp:` (still configured in the config file) is set.
        Webhook header values are write-only and always listed as `null`.
        Requires the `admin` permission.
      security:
        - webUIBearer: []
      responses:
        "200":
          description: Stored notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationConfigList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/StateDBUnavailable"
    post:
      tags: [admin]
      summary: Create a notification
      operationId: createNotificationConfig
      description: >
        Validates and stores a new notification; it can be referenced
        immediately. Requires the `admin` permission.
      security:
        - webUIBearer: []
      requestBody:
        required: true
