openapi: 3.0.3
info:
  title: go-backup-tool API
  description: >
    HTTP surface exposed by go-backup-tool's web UI process: the dashboard's
    read-only JSON endpoints (status, receiver state, logs, audit events) and
    the receiver API that another go-backup-tool instance's `type: remote`
    targets write objects to. Both are served from the same listen address
    (see `-listen` / `webui:` in the config file).
  version: "1.0"
servers:
  - url: http://localhost:8080
    description: Default web UI listen address (configurable via -listen / webui.listen)

tags:
  - name: dashboard
    description: Read-only JSON endpoints backing the web UI dashboard
  - name: auth
    description: Dashboard login/logout (bearer-token based)
  - name: admin
    description: "The dashboard's \"Users\" admin section: managing accounts and their long-lived API tokens"
  - name: receiver-api
    description: "Object ingestion API for `type: remote` targets, authenticated per-receiver via a signed JWT bearer token"

paths:
  /api/meta:
    get:
      tags: [dashboard]
      summary: Build/auth metadata for the dashboard shell
      operationId: getMeta
      description: >
        Always public/unauthenticated, since the dashboard shell (GET /)
        itself is public and needs this before any session exists. Backs the
        dashboard's footer and its login-link visibility.
      security: []
      responses:
        "200":
          description: Build/auth metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"

  /api/session:
    get:
      tags: [dashboard]
      summary: The currently authenticated session's identity and permissions
      operationId: getSession
      description: >
        Everything the dashboard's own JavaScript needs to decide which
        sections to show; the server-side handlers behind those sections
        enforce the same rules independently on every actual request. Unlike
        every other `/api/...` endpoint, this only requires a currently
        valid session, not any specific permission.
      security:
        - webUIBearer: []
      responses:
        "200":
          description: Session info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/status:
    get:
      tags: [dashboard]
      summary: Current job/target statuses
      operationId: getStatus
      description: >
        Snapshot of every configured backup job and its targets, polled by
        the dashboard. Requires the `view` permission.
      security:
        - webUIBearer: []
      responses:
        "200":
          description: Job statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/logs:
    get:
      tags: [dashboard]
      summary: Recent log lines
      operationId: getLogs
      description: >
        The most recent buffered log lines (see `enable-log-viewer:` in the
        config file), oldest first. Requires the `view` permission.
      security:
        - webUIBearer: []
      responses:
        "200":
          description: Buffered log lines
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/identity:
    get:
      tags: [dashboard]
      summary: This instance's server identity
      operationId: getIdentity
      description: >
        This instance's persistent UUID and PEM-encoded public key, used to
        fill in a `receivers:` entry on another instance. A zero-value object
        is returned if no identity was loaded at startup. Requires the
        `view` permission.
      security:
        - webUIBearer: []
      responses:
        "200":
          description: Server identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/receivers:
    get:
      tags: [dashboard]
      summary: Current receiver statuses
      operationId: getReceivers
      description: >
        Live state of every configured receiver, annotated with staleness
        for any receiver with `stale-after:` set. Requires the `view`
        permission.
      security:
        - webUIBearer: []
      responses:
        "200":
          description: Receiver statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReceiverSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/job-runs:
    get:
      tags: [dashboard]
      summary: Historical job run log
      operationId: getJobRunEvents
      description: >
        The most recently recorded job runs (up to 200) across every job,
        newest first. Requires the `job-run-log` permission, independent of
        `view`.
      security:
        - webUIBearer: []
      responses:
        "200":
          description: Job run events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobRunEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/target-runs:
    get:
      tags: [dashboard]
      summary: Historical job target run log
      operationId: getTargetRunEvents
      description: >
        The most recently recorded job target runs (up to 200) across every
        job, newest first. Requires the `target-run-log` permission,
        independent of `view`.
      security:
        - webUIBearer: []
      responses:
        "200":
          description: Target run events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TargetRunEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/jobs/{name}/retry:
    post:
      tags: [admin]
      summary: Retry a job's currently failed targets
      operationId: retryFailedTargets
      description: >
        Kicks off a re-run of the named job's pipeline for whichever of its
        targets `/api/status` currently reports as failed (re-running the
        whole pipeline, not just re-uploading). Starts the retry in the
        background and returns immediately; poll `/api/status` for
        progress. Requires admin access (the config-file admin, or a
        session holding the `admin` permission).
      security:
        - webUIBearer: []
      parameters:
        - name: name
          in: path
          required: true
          description: Job name, as configured under `jobs:` in the config file.
          schema:
            type: string
      responses:
        "202":
          description: Retry started
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Unknown job name
          content:
            text/plain:
              schema:
                type: string
        "409":
          description: No failed targets to retry
          content:
            text/plain:
              schema:
                type: string

  /api/receivers/{id}/files:
    get:
      tags: [dashboard]
      summary: Files currently stored under a receiver
      operationId: getReceiverFiles
      description: Requires the `view` permission.
      security:
        - webUIBearer: []
      parameters:
        - $ref: "#/components/parameters/ReceiverId"
      responses:
        "200":
          description: Objects currently stored under this receiver's path
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReceiverFile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Unknown receiver id
          content:
            text/plain:
              schema:
                type: string

  /api/receivers/{id}/download/{key}:
    post:
      tags: [dashboard]
      summary: Mint a one-time download ticket for a file stored under a receiver
      operationId: mintDownloadTicket
      description: >
        Mints a short-lived (60s), single-use download ticket for this
        receiver/key, attributed to whoever is currently logged in. The
        dashboard's own JavaScript calls this (bearer-authenticated) right
        before navigating the browser to the matching GET below, which — as
        a plain page navigation — can't carry an Authorization header.
        Requires the `download` permission (which implies `view`).
      security:
        - webUIBearer: []
      parameters:
        - $ref: "#/components/parameters/ReceiverId"
        - name: key
          in: path
          required: true
          description: Object key, relative to the receiver's storage path (may contain "/").
          schema:
            type: string
      responses:
        "200":
          description: Download ticket
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket:
                    type: string
                required: [ticket]
        "400":
          description: Invalid object key
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Unknown receiver id
          content:
            text/plain:
              schema:
                type: string
    get:
      tags: [dashboard]
      summary: Download a file stored under a receiver
      operationId: downloadReceiverFile
      description: >
        Streams the raw content of one object. Authorized by a one-time
        ticket (see the POST operation above) rather than a bearer token,
        since this request is a plain browser navigation.
      security: []
      parameters:
        - $ref: "#/components/parameters/ReceiverId"
        - name: key
          in: path
          required: true
          description: Object key, relative to the receiver's storage path (may contain "/").
          schema:
            type: string
        - name: ticket
          in: query
          required: true
          description: A ticket minted by POSTing to this same path.
          schema:
            type: string
      responses:
        "200":
          description: File content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid object key
          content:
            text/plain:
              schema:
                type: string
        "403":
          description: Missing, invalid, expired, or already-used download ticket
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Unknown receiver id, or file not found
          content:
            text/plain:
              schema:
                type: string

  /api/login-events:
    get:
      tags: [dashboard]
      summary: Recent dashboard login attempts
      operationId: getLoginEvents
      description: >
        The most recently recorded login attempts (up to 200), newest
        first. Requires the `login-log` permission, independent of `view`.
      security:
        - webUIBearer: []
      responses:
        "200":
          description: Login events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LoginEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/download-events:
    get:
      tags: [dashboard]
      summary: Recent file download attempts
      operationId: getDownloadEvents
      description: >
        The most recently recorded download attempts (up to 200), newest
        first. Requires the `download-log` permission, independent of
        `view`/`download`.
      security:
        - webUIBearer: []
      responses:
        "200":
          description: Download events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DownloadEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/receiver-events:
    get:
      tags: [dashboard]
      summary: Recent receiver API requests
      operationId: getReceiverEvents
      description: >
        The most recently recorded receiver API requests (PUT or DELETE, up
        to 200) across every receiver, win or lose, newest first. Requires
        the `receiver-log` permission, independent of `view`.
      security:
        - webUIBearer: []
      responses:
        "200":
          description: Receiver events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReceiverEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /login:
    get:
      tags: [auth]
      summary: Dashboard login page
      operationId: getLoginPage
      security: []
      parameters:
        - name: next
          in: query
          required: false
          description: Same-site path to redirect to after a successful login.
          schema:
            type: string
      responses:
        "200":
          description: Login form (HTML)
          content:
            text/html:
              schema:
                type: string
        "303":
          description: No login configured; redirected straight to next
    post:
      tags: [auth]
      summary: Submit dashboard username/password login
      operationId: postLogin
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                next:
                  type: string
              required: [username, password]
      responses:
        "200":
          description: Successful login; bearer token returned as JSON
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
                required: [token, expires_at]
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required: [error]
        "404":
          description: No username/password configured on this instance

  /login/oidc:
    get:
      tags: [auth]
      summary: Start an OIDC SSO login
      operationId: getOIDCLogin
      description: >
        Only mounted when `webui.oidc.enabled:` is configured. Starts a new
        in-flight login (tracked server-side by a `state` value) and
        redirects the browser to the identity provider to authenticate.
      security: []
      parameters:
        - name: next
          in: query
          required: false
          description: Same-site path to redirect to once the login completes.
          schema:
            type: string
      responses:
        "303":
          description: Redirect to the identity provider's authorization endpoint

  /login/oidc/callback:
    get:
      tags: [auth]
      summary: OIDC SSO callback
      operationId: getOIDCCallback
      description: >
        Only mounted when `webui.oidc.enabled:` is configured. The redirect
        target the identity provider sends the browser back to once
        authenticated. On success it starts a dashboard session and serves
        a small bridge page whose inline script stores the token
        client-side (the way `POST /login`'s JSON response lets the
        dashboard's own JS do directly) and navigates on to the original
        `next`.
      security: []
      parameters:
        - name: state
          in: query
          required: true
          description: The in-flight login this callback corresponds to.
          schema:
            type: string
        - name: code
          in: query
          required: false
          description: Authorization code to exchange for tokens.
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: Set by the provider instead of `code` if authentication failed there.
          schema:
            type: string
        - name: error_description
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Bridge page (HTML) that stores the new session token and redirects
          content:
            text/html:
              schema:
                type: string
        "400":
          description: Unknown or expired login state
          content:
            text/plain:
              schema:
                type: string
        "502":
          description: The identity provider returned an error, or the code exchange/ID token verification failed
          content:
            text/plain:
              schema:
                type: string

  /api/logout:
    post:
      tags: [auth]
      summary: End the current dashboard session
      operationId: logout
      description: >
        Revokes the bearer token carried in the Authorization header, if
        any (a missing or already-invalid one is a no-op). Always succeeds;
        the caller is expected to discard its own copy of the token
        regardless of the response.
      security:
        - webUIBearer: []
      responses:
        "204":
          description: Token revoked (or there was none to revoke)

  /api/users:
    get:
      tags: [admin]
      summary: List dashboard accounts
      operationId: listUsers
      description: >
        Every web UI account managed through the "Users" admin section.
        Requires admin access (the config-file admin, or a session holding
        the `admin` permission).
      security:
        - webUIBearer: []
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [admin]
      summary: Create a dashboard account
      operationId: createUser
      description: >
        Requires admin access. Rejects a username already taken, one
        reserved for the config-file admin, or an `oidc_username` already
        linked to another account.
      security:
        - webUIBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRequest"
      responses:
        "201":
          description: User created
        "400":
          description: Missing username/password, or an unknown permission name
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Username already exists, or `oidc_username` is already linked to another account
          content:
            text/plain:
              schema:
                type: string
        "503":
          description: User management requires the job state db, which isn't configured
          content:
            text/plain:
              schema:
                type: string

  /api/users/{username}:
    put:
      tags: [admin]
      summary: Update a dashboard account
      operationId: updateUser
      description: >
        Updates the named account's permissions and OIDC identity link, and
        its password too if `password` is non-empty (a blank `password`
        leaves the stored one unchanged). Requires admin access.
      security:
        - webUIBearer: []
      parameters:
        - $ref: "#/components/parameters/Username"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRequest"
      responses:
        "204":
          description: User updated
        "400":
          description: Unknown permission name
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Unknown username
          content:
            text/plain:
              schema:
                type: string
        "409":
          description: "`oidc_username` is already linked to another account"
          content:
            text/plain:
              schema:
                type: string
        "503":
          description: User management requires the job state db, which isn't configured
          content:
            text/plain:
              schema:
                type: string
    delete:
      tags: [admin]
      summary: Delete a dashboard account
      operationId: deleteUser
      description: Requires admin access.
      security:
        - webUIBearer: []
      parameters:
        - $ref: "#/components/parameters/Username"
      responses:
        "204":
          description: User deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Unknown username
          content:
            text/plain:
              schema:
                type: string
        "503":
          description: User management requires the job state db, which isn't configured
          content:
            text/plain:
              schema:
                type: string

  /api/users/{username}/tokens:
    get:
      tags: [admin]
      summary: List a dashboard account's issued long-lived API tokens
      operationId: listUserTokens
      description: >
        Every long-lived API token issued for the named account, most
        recently issued first. Requires admin access.
      security:
        - webUIBearer: []
      parameters:
        - $ref: "#/components/parameters/Username"
      responses:
        "200":
          description: API tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/APIToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [admin]
      summary: Issue a long-lived API token for a dashboard account
      operationId: issueUserToken
      description: >
        Mints a bearer token carrying the named account's currently granted
        permissions, valid for the requested number of days — the same
        kind of token an interactive login produces, for
        scripts/automation that can't sit through one. The raw token is
        returned once, here, and never again; only its `jti` is kept for
        later revocation (see `DELETE
        /api/users/{username}/tokens/{jti}`). Requires admin access.
      security:
        - webUIBearer: []
      parameters:
        - $ref: "#/components/parameters/Username"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                days:
                  type: integer
                  description: How many days the token should stay valid for (1-3650).
              required: [days]
      responses:
        "200":
          description: Token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
                required: [token, expires_at]
        "400":
          description: days out of range, or invalid request body
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Unknown username
          content:
            text/plain:
              schema:
                type: string
        "503":
          description: User management requires the job state db, which isn't configured
          content:
            text/plain:
              schema:
                type: string

  /api/users/{username}/tokens/{jti}:
    delete:
      tags: [admin]
      summary: Revoke a dashboard account's long-lived API token
      operationId: revokeUserToken
      description: >
        Revoking an already-revoked token is a no-op, not an error.
        Requires admin access.
      security:
        - webUIBearer: []
      parameters:
        - $ref: "#/components/parameters/Username"
        - name: jti
          in: path
          required: true
          description: The token's id, from the matching `GET .../tokens` listing.
          schema:
            type: string
      responses:
        "204":
          description: Token revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Unknown jti, or jti does not belong to username
          content:
            text/plain:
              schema:
                type: string
        "503":
          description: User management requires the job state db, which isn't configured
          content:
            text/plain:
              schema:
                type: string

  /api/v1/objects/{id}/{key}:
    put:
      tags: [receiver-api]
      summary: Write (upload) an object to a receiver
      operationId: putObject
      description: >
        Called by another go-backup-tool instance's `type: remote` target.
        The request body is written to disk exactly as a `type: local`
        target would (atomic temp-file-then-rename), and tracked for
        retention.
      security:
        - receiverBearer: []
      parameters:
        - $ref: "#/components/parameters/ReceiverId"
        - $ref: "#/components/parameters/ObjectKey"
        - name: creationTime
          in: query
          required: false
          description: >
            RFC3339 timestamp of when the backup content was actually
            produced, for retention purposes, rather than upload time. Must
            be strictly before the upload time. Also stamped as the written
            file's mtime.
          schema:
            type: string
            format: date-time
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Object written
        "400":
          description: Invalid object key
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Missing or invalid bearer token
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Unknown receiver id
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Writing the object failed
          content:
            text/plain:
              schema:
                type: string
    delete:
      tags: [receiver-api]
      summary: Delete an object from a receiver
      operationId: deleteObject
      description: The client-facing counterpart to the backup pipeline's remote-delete step.
      security:
        - receiverBearer: []
      parameters:
        - $ref: "#/components/parameters/ReceiverId"
        - $ref: "#/components/parameters/ObjectKey"
      responses:
        "204":
          description: Object deleted
        "400":
          description: Invalid object key
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Missing or invalid bearer token
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Unknown receiver id
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Deleting the object failed
          content:
            text/plain:
              schema:
                type: string

components:
  securitySchemes:
    webUIBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        HS256 JWT returned by a successful /login (or, for SSO, minted
        after the /login/oidc/callback dance and handed to the browser via
        an inline script), signed with a key generated fresh per server
        process — a restart invalidates every session. Only enforced when
        webui.username or OIDC is configured, otherwise these endpoints are
        open.
    receiverBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Per-receiver JWT, signed by the sending instance's private key and
        verified against the receiver's configured public-key: (see
        remoteAuth.SignRemoteAuthToken/VerifyRemoteAuthToken). Independent of
        the dashboard's own session auth.

  parameters:
    ReceiverId:
      name: id
      in: path
      required: true
      description: "Receiver id, as configured under `receivers:` in the config file."
      schema:
        type: string
    ObjectKey:
      name: key
      in: path
      required: true
      description: Object key, relative to the receiver's storage path (may contain "/").
      schema:
        type: string
    Username:
      name: username
      in: path
      required: true
      description: A dashboard account's username, as created via `POST /api/users`.
      schema:
        type: string

  responses:
    Unauthorized:
      description: No valid dashboard session
      content:
        text/plain:
          schema:
            type: string
    Forbidden:
      description: Valid session, but missing the permission this endpoint requires
      content:
        text/plain:
          schema:
            type: string

  schemas:
    Permission:
      type: string
      description: >
        A single dashboard session capability. `download` implies `view`;
        `admin` implies every other permission.
      enum:
        [
          view,
          download,
          admin,
          login-log,
          download-log,
          job-run-log,
          target-run-log,
          receiver-log,
        ]

    Meta:
      type: object
      description: Build/auth metadata for the dashboard shell (always public).
      properties:
        version:
          type: string
        commit:
          type: string
        auth_enabled:
          type: boolean
        oidc_enabled:
          type: boolean
      required: [version, commit, auth_enabled, oidc_enabled]

    SessionInfo:
      type: object
      properties:
        username:
          type: string
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        admin:
          type: boolean
          description: True if this session can reach the "Users" admin section.
        oidc_enabled:
          type: boolean
      required: [permissions, admin, oidc_enabled]

    JobRunEvent:
      type: object
      properties:
        job_name:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        success:
          type: boolean
        size:
          type: integer
          format: int64
        error:
          type: string
      required: [job_name, start, end, success, size]

    TargetRunEvent:
      type: object
      properties:
        at:
          type: string
          format: date-time
        job_name:
          type: string
        target:
          type: string
        success:
          type: boolean
        state:
          $ref: "#/components/schemas/RunState"
        error:
          type: string
      required: [at, job_name, target, success, state]

    ReceiverEvent:
      type: object
      properties:
        at:
          type: string
          format: date-time
        receiver_id:
          type: string
        kind:
          type: string
          description: Which receiver API request this was.
          enum: [receive, delete]
        key:
          type: string
        size:
          type: integer
          format: int64
        success:
          type: boolean
        error:
          type: string
      required: [at, receiver_id, kind, key, size, success]

    User:
      type: object
      description: One dashboard account managed through the "Users" admin section.
      properties:
        username:
          type: string
        oidc_username:
          type: string
          description: Empty if this account has no linked/auto-provisioned OIDC identity.
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        created_at:
          type: string
          format: date-time
      required: [username, oidc_username, permissions, created_at]

    UserRequest:
      type: object
      description: >
        Request body for creating (`POST /api/users`) or updating (`PUT
        /api/users/{username}`) a dashboard account. `username` is only
        used (and required) when creating one. `password` is required when
        creating one, but optional when updating one — omitted or blank
        leaves the stored password unchanged. `oidc_username` is always a
        full-replace value; blank explicitly clears the link.
      properties:
        username:
          type: string
        password:
          type: string
        oidc_username:
          type: string
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
      required: [permissions]

    APIToken:
      type: object
      description: >
        One long-lived API token issued for a dashboard account (see `POST
        /api/users/{username}/tokens`). Never carries the token's own
        signed value — only its `jti`, shown once at issuance and never
        again.
      properties:
        jti:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        revoked:
          type: boolean
        revoked_at:
          type: string
          format: date-time
      required: [jti, created_at, expires_at, revoked]

    RunState:
      type: string
      description: >
        idle: never run yet. running: currently executing. ok: last run
        succeeded. incomplete: job only — succeeded on some targets, not
        all. failed: last run failed.
      enum: [idle, running, ok, incomplete, failed]

    TargetSnapshot:
      type: object
      properties:
        server:
          type: string
        bucket:
          type: string
        kind:
          type: string
        state:
          $ref: "#/components/schemas/RunState"
        error:
          type: string
      required: [server, bucket, kind, state]

    JobSnapshot:
      type: object
      properties:
        name:
          type: string
        interval:
          type: string
        state:
          $ref: "#/components/schemas/RunState"
        last_start:
          type: string
          format: date-time
        last_end:
          type: string
          format: date-time
        next_run:
          type: string
          format: date-time
          description: Zero time if not (yet) scheduled, e.g. a one-shot job that already ran.
        duration:
          type: string
        size:
          type: string
          description: Encrypted object size from the last successful run; sticky across a later failure.
        error:
          type: string
        targets:
          type: array
          items:
            $ref: "#/components/schemas/TargetSnapshot"
      required: [name, state, last_start, last_end, next_run, targets]

    Identity:
      type: object
      properties:
        uuid:
          type: string
        public_key:
          type: string
          description: PEM-encoded public key.
      required: [uuid, public_key]

    ReceiverSnapshot:
      type: object
      properties:
        id:
          type: string
        path:
          type: string
        retention:
          type: string
        state:
          allOf:
            - $ref: "#/components/schemas/RunState"
          description: idle until the first object is received.
        last_key:
          type: string
        last_seen:
          type: string
          format: date-time
          description: Zero time if nothing has been received yet.
        error:
          type: string
        stale_after:
          type: string
          description: "Set only when this receiver has stale-after: configured."
        stale:
          type: boolean
          description: True once the most recent file is older than stale_after.
      required: [id, path, state, last_seen]

    ReceiverFile:
      type: object
      properties:
        key:
          type: string
        size:
          type: integer
          format: int64
        mod_time:
          type: string
          format: date-time
      required: [key, size, mod_time]

    LoginEvent:
      type: object
      properties:
        at:
          type: string
          format: date-time
        username:
          type: string
        method:
          type: string
          enum: [password, oidc]
        success:
          type: boolean
        remote_addr:
          type: string
        detail:
          type: string
          description: Failure reason; empty on success.
      required: [at, username, method, success, remote_addr]

    DownloadEvent:
      type: object
      properties:
        at:
          type: string
          format: date-time
        username:
          type: string
        receiver_id:
          type: string
        key:
          type: string
        success:
          type: boolean
        remote_addr:
          type: string
        detail:
          type: string
          description: Failure reason; empty on success.
      required: [at, username, receiver_id, key, success, remote_addr]
