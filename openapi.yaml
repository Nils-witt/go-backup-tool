openapi: 3.0.3
info:
  title: go-backup-tool API
  description: >
    HTTP surface exposed by go-backup-tool's web UI process: the dashboard's
    read-only JSON endpoints (status, receiver state, logs, audit events) and
    the receiver API that another go-backup-tool instance's `type: remote`
    targets write objects to. Both are served from the same listen address
    (see `-listen` / `webui:` in the config file).
  version: "1.0"
servers:
  - url: http://localhost:8080
    description: Default web UI listen address (configurable via -listen / webui.listen)

tags:
  - name: dashboard
    description: Read-only JSON endpoints backing the web UI dashboard
  - name: auth
    description: Dashboard SSO (OpenID Connect) — the SPA logs in as a public client and sends the provider's access token as a bearer token
  - name: admin
    description: Actions requiring the `admin` permission
  - name: receiver-api
    description: "Object ingestion API for `type: remote` targets, authenticated per-receiver via a signed JWT bearer token"

paths:
  /api/meta:
    get:
      tags: [dashboard]
      summary: Build metadata for the dashboard footer
      operationId: getMeta
      description: >
        Always public/unauthenticated, since the footer is shown on the
        login page too.
      security: []
      responses:
        "200":
          description: Build metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"

  /api/sso/status:
    get:
      tags: [auth]
      summary: Public SSO settings for the login page
      operationId: getSSOStatus
      description: >
        Always public/unauthenticated: the login page needs this before any
        credential exists, to run the OIDC authorization-code + PKCE flow
        itself as a public client. The provider fields are only present
        while `webui.oidc.enabled` is true; none of them are secret.
      security: []
      responses:
        "200":
          description: SSO settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SSOStatus"

  /api/me:
    get:
      tags: [auth]
      summary: The signed-in user's identity and permissions
      operationId: getMe
      description: >
        Everything the dashboard's own JavaScript needs to decide which
        sections to show; the server-side handlers behind those sections
        enforce the same rules independently on every actual request. Only
        requires a valid access token, not any specific permission. Records
        nothing — see `POST /api/sso/login`.
      security:
        - webUIBearer: []
      responses:
        "200":
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/sso/login:
    post:
      tags: [auth]
      summary: Record a completed SSO login
      operationId: ssoLogin
      description: >
        The server takes no part in the login itself, so the SPA calls this
        exactly once after the provider's redirect back, to record the
        sign-in in the login log. Returns the same body as `GET /api/me`.
      security:
        - webUIBearer: []
      responses:
        "200":
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/status:
    get:
      tags: [dashboard]
      summary: Current job/target statuses
      operationId: getStatus
      description: >
        Snapshot of every configured backup job and its targets. The
        dashboard follows `/api/live` instead and only polls this as a
        fallback. Requires the `view` permission.
      security:
        - webUIBearer: []
      responses:
        "200":
          description: Job statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/logs:
    get:
      tags: [dashboard]
      summary: Recent log lines
      operationId: getLogs
      description: >
        The most recent buffered log lines (see `enable-log-viewer:` in the
        config file), oldest first. Requires the `view` permission.
      security:
        - webUIBearer: []
      responses:
        "200":
          description: Buffered log lines
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/identity:
    get:
      tags: [dashboard]
      summary: This instance's server identity
      operationId: getIdentity
      description: >
        This instance's persistent UUID and PEM-encoded public key, used to
        fill in a `receivers:` entry on another instance. A zero-value object
        is returned if no identity was loaded at startup. Requires the
        `view` permission.
      security:
        - webUIBearer: []
      responses:
        "200":
          description: Server identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/receivers:
    get:
      tags: [dashboard]
      summary: Current receiver statuses
      operationId: getReceivers
      description: >
        Live state of every configured receiver, annotated with staleness
        for any receiver with `stale-after:` set. Requires the `view`
        permission.
      security:
        - webUIBearer: []
      responses:
        "200":
          description: Receiver statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReceiverSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/live/ticket:
    post:
      tags: [dashboard]
      summary: Mint a one-time ticket for the live status WebSocket
      operationId: mintLiveTicket
      description: >
        Mints a short-lived (60s), single-use ticket for opening
        `GET /api/live`, since a browser can't attach an `Authorization`
        header to a WebSocket handshake. Requires the `view` permission.
      security:
        - webUIBearer: []
      responses:
        "200":
          description: Live status ticket
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket:
                    type: string
                required: [ticket]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/live:
    get:
      tags: [dashboard]
      summary: Live job/target/receiver status (WebSocket)
      operationId: getLiveStatus
      description: >
        Upgrades to a WebSocket that pushes a `LiveStatus` JSON text message
        once on connect, whenever a job, target or receiver changes state
        (bursts are merged into one message), and at least every 30s.
        Each message carries the full current state — the same data as
        `/api/status` and `/api/receivers` — so clients simply replace what
        they have. Clients must not send data messages; one closes the
        connection. Authorized by a one-time ticket from
        `POST /api/live/ticket` rather than a bearer token. The server
        closes the socket with status 1001 (going away) when it shuts down.
      security: []
      parameters:
        - name: ticket
          in: query
          required: true
          description: A ticket minted by `POST /api/live/ticket`.
          schema:
            type: string
      responses:
        "101":
          description: Switching to the WebSocket protocol; messages are `LiveStatus` objects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveStatus"
        "403":
          description: Missing, invalid, expired, or already-used live status ticket
          content:
            text/plain:
              schema:
                type: string

  /api/job-runs:
    get:
      tags: [dashboard]
      summary: Historical job run log
      operationId: getJobRunEvents
      description: >
        The most recently recorded job runs (up to 200) across every job,
        newest first. Requires the `job-run-log` permission, independent of
        `view`.
      security:
        - webUIBearer: []
      responses:
        "200":
          description: Job run events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobRunEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/target-runs:
    get:
      tags: [dashboard]
      summary: Historical job target run log
      operationId: getTargetRunEvents
      description: >
        The most recently recorded job target runs (up to 200) across every
        job, newest first. Requires the `target-run-log` permission,
        independent of `view`.
      security:
        - webUIBearer: []
      responses:
        "200":
          description: Target run events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TargetRunEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/jobs/{name}/retry:
    post:
      tags: [admin]
      summary: Retry a job's currently failed targets
      operationId: retryFailedTargets
      description: >
        Kicks off a re-run of the named job's pipeline for whichever of its
        targets `/api/status` currently reports as failed (re-running the
        whole pipeline, not just re-uploading). Starts the retry in the
        background and returns immediately; follow `/api/live` (or poll
        `/api/status`) for progress. Requires the `admin` permission.
      security:
        - webUIBearer: []
      parameters:
        - name: name
          in: path
          required: true
          description: Job name, as configured under `jobs:` in the config file.
          schema:
            type: string
      responses:
        "202":
          description: Retry started
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Unknown job name
          content:
            text/plain:
              schema:
                type: string
        "409":
          description: No failed targets to retry
          content:
            text/plain:
              schema:
                type: string

  /api/receivers/{id}/files:
    get:
      tags: [dashboard]
      summary: Files currently stored under a receiver
      operationId: getReceiverFiles
      description: Requires the `view` permission.
      security:
        - webUIBearer: []
      parameters:
        - $ref: "#/components/parameters/ReceiverId"
      responses:
        "200":
          description: Objects currently stored under this receiver's path
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReceiverFile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Unknown receiver id
          content:
            text/plain:
              schema:
                type: string

  /api/receivers/{id}/download/{key}:
    post:
      tags: [dashboard]
      summary: Mint a one-time download ticket for a file stored under a receiver
      operationId: mintDownloadTicket
      description: >
        Mints a short-lived (60s), single-use download ticket for this
        receiver/key, attributed to whoever is currently logged in. The
        dashboard's own JavaScript calls this (bearer-authenticated) right
        before navigating the browser to the matching GET below, which — as
        a plain page navigation — can't carry an Authorization header.
        Requires the `download` permission (which implies `view`).
      security:
        - webUIBearer: []
      parameters:
        - $ref: "#/components/parameters/ReceiverId"
        - name: key
          in: path
          required: true
          description: Object key, relative to the receiver's storage path (may contain "/").
          schema:
            type: string
      responses:
        "200":
          description: Download ticket
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket:
                    type: string
                required: [ticket]
        "400":
          description: Invalid object key
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Unknown receiver id
          content:
            text/plain:
              schema:
                type: string
    get:
      tags: [dashboard]
      summary: Download a file stored under a receiver
      operationId: downloadReceiverFile
      description: >
        Streams the raw content of one object. Authorized by a one-time
        ticket (see the POST operation above) rather than a bearer token,
        since this request is a plain browser navigation.
      security: []
      parameters:
        - $ref: "#/components/parameters/ReceiverId"
        - name: key
          in: path
          required: true
          description: Object key, relative to the receiver's storage path (may contain "/").
          schema:
            type: string
        - name: ticket
          in: query
          required: true
          description: A ticket minted by POSTing to this same path.
          schema:
            type: string
      responses:
        "200":
          description: File content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid object key
          content:
            text/plain:
              schema:
                type: string
        "403":
          description: Missing, invalid, expired, or already-used download ticket
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Unknown receiver id, or file not found
          content:
            text/plain:
              schema:
                type: string

  /api/login-events:
    get:
      tags: [dashboard]
      summary: Recent dashboard login attempts
      operationId: getLoginEvents
      description: >
        The most recently recorded login attempts (up to 200), newest
        first. Requires the `login-log` permission, independent of `view`.
      security:
        - webUIBearer: []
      responses:
        "200":
          description: Login events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LoginEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/download-events:
    get:
      tags: [dashboard]
      summary: Recent file download attempts
      operationId: getDownloadEvents
      description: >
        The most recently recorded download attempts (up to 200), newest
        first. Requires the `download-log` permission, independent of
        `view`/`download`.
      security:
        - webUIBearer: []
      responses:
        "200":
          description: Download events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DownloadEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/receiver-events:
    get:
      tags: [dashboard]
      summary: Recent receiver API requests
      operationId: getReceiverEvents
      description: >
        The most recently recorded receiver API requests (PUT or DELETE, up
        to 200) across every receiver, win or lose, newest first. Requires
        the `receiver-log` permission, independent of `view`.
      security:
        - webUIBearer: []
      responses:
        "200":
          description: Receiver events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReceiverEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/objects/{id}/{key}:
    put:
      tags: [receiver-api]
      summary: Write (upload) an object to a receiver
      operationId: putObject
      description: >
        Called by another go-backup-tool instance's `type: remote` target.
        The request body is written to disk exactly as a `type: local`
        target would (atomic temp-file-then-rename), and tracked for
        retention.
      security:
        - receiverBearer: []
      parameters:
        - $ref: "#/components/parameters/ReceiverId"
        - $ref: "#/components/parameters/ObjectKey"
        - name: creationTime
          in: query
          required: false
          description: >
            RFC3339 timestamp of when the backup content was actually
            produced, for retention purposes, rather than upload time. Must
            be strictly before the upload time. Also stamped as the written
            file's mtime.
          schema:
            type: string
            format: date-time
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Object written
        "400":
          description: Invalid object key
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Missing or invalid bearer token
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Unknown receiver id
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Writing the object failed
          content:
            text/plain:
              schema:
                type: string
    delete:
      tags: [receiver-api]
      summary: Delete an object from a receiver
      operationId: deleteObject
      description: The client-facing counterpart to the backup pipeline's remote-delete step.
      security:
        - receiverBearer: []
      parameters:
        - $ref: "#/components/parameters/ReceiverId"
        - $ref: "#/components/parameters/ObjectKey"
      responses:
        "204":
          description: Object deleted
        "400":
          description: Invalid object key
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Missing or invalid bearer token
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Unknown receiver id
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Deleting the object failed
          content:
            text/plain:
              schema:
                type: string

components:
  securitySchemes:
    webUIBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        The OIDC provider's access token (a JWT), obtained by the SPA as a
        public client (authorization code + PKCE). Verified on every request
        against the issuer's JWKS (signature, issuer, expiry) and required to
        name `webui.oidc.client-id` as its `azp` or in its `aud`. Permissions
        are `webui.oidc.default-permissions` plus whatever the token's groups
        map to in `webui.oidc.group-permissions`. Without `webui.oidc`
        enabled, every request is rejected.
    receiverBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Per-receiver JWT, signed by the sending instance's private key and
        verified against the receiver's configured public-key: (see
        remoteAuth.SignRemoteAuthToken/VerifyRemoteAuthToken). Independent of
        the dashboard's own SSO auth.

  parameters:
    ReceiverId:
      name: id
      in: path
      required: true
      description: "Receiver id, as configured under `receivers:` in the config file."
      schema:
        type: string
    ObjectKey:
      name: key
      in: path
      required: true
      description: Object key, relative to the receiver's storage path (may contain "/").
      schema:
        type: string

  responses:
    Unauthorized:
      description: Missing, invalid, or expired access token
      content:
        text/plain:
          schema:
            type: string
    Forbidden:
      description: Valid access token, but missing the permission this endpoint requires
      content:
        text/plain:
          schema:
            type: string

  schemas:
    LiveStatus:
      type: object
      description: One message on the `/api/live` WebSocket.
      properties:
        type:
          type: string
          enum: [status]
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/JobSnapshot"
        receivers:
          type: array
          items:
            $ref: "#/components/schemas/ReceiverSnapshot"
      required: [type, jobs, receivers]
    Permission:
      type: string
      description: >
        A single dashboard capability. `download` implies `view`;
        `admin` implies every other permission.
      enum:
        [
          view,
          download,
          admin,
          login-log,
          download-log,
          job-run-log,
          target-run-log,
          receiver-log,
        ]

    Meta:
      type: object
      description: Build metadata for the dashboard footer (always public).
      properties:
        version:
          type: string
        commit:
          type: string
      required: [version, commit]

    SSOStatus:
      type: object
      properties:
        enabled:
          type: boolean
        buttonLabel:
          type: string
        issuerUrl:
          type: string
        clientId:
          type: string
        scopes:
          type: string
          description: Space-separated OAuth2 scopes the SPA should request.
      required: [enabled, buttonLabel]

    Me:
      type: object
      properties:
        username:
          type: string
          description: The token's preferred_username, else its email, else its subject.
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        admin:
          type: boolean
          description: True if this user holds the `admin` permission.
      required: [username, permissions, admin]

    JobRunEvent:
      type: object
      properties:
        job_name:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        success:
          type: boolean
        size:
          type: integer
          format: int64
        error:
          type: string
      required: [job_name, start, end, success, size]

    TargetRunEvent:
      type: object
      properties:
        at:
          type: string
          format: date-time
        job_name:
          type: string
        target:
          type: string
        success:
          type: boolean
        state:
          $ref: "#/components/schemas/RunState"
        error:
          type: string
      required: [at, job_name, target, success, state]

    ReceiverEvent:
      type: object
      properties:
        at:
          type: string
          format: date-time
        receiver_id:
          type: string
        kind:
          type: string
          description: Which receiver API request this was.
          enum: [receive, delete]
        key:
          type: string
        size:
          type: integer
          format: int64
        success:
          type: boolean
        error:
          type: string
      required: [at, receiver_id, kind, key, size, success]

    RunState:
      type: string
      description: >
        idle: never run yet. running: currently executing. ok: last run
        succeeded. incomplete: job only — succeeded on some targets, not
        all. failed: last run failed.
      enum: [idle, running, ok, incomplete, failed]

    TargetSnapshot:
      type: object
      properties:
        server:
          type: string
        bucket:
          type: string
        kind:
          type: string
        state:
          $ref: "#/components/schemas/RunState"
        error:
          type: string
      required: [server, bucket, kind, state]

    JobSnapshot:
      type: object
      properties:
        name:
          type: string
        interval:
          type: string
        state:
          $ref: "#/components/schemas/RunState"
        last_start:
          type: string
          format: date-time
        last_end:
          type: string
          format: date-time
        next_run:
          type: string
          format: date-time
          description: Zero time if not (yet) scheduled, e.g. a one-shot job that already ran.
        duration:
          type: string
        size:
          type: string
          description: Encrypted object size from the last successful run; sticky across a later failure.
        error:
          type: string
        targets:
          type: array
          items:
            $ref: "#/components/schemas/TargetSnapshot"
      required: [name, state, last_start, last_end, next_run, targets]

    Identity:
      type: object
      properties:
        uuid:
          type: string
        public_key:
          type: string
          description: PEM-encoded public key.
      required: [uuid, public_key]

    ReceiverSnapshot:
      type: object
      properties:
        id:
          type: string
        path:
          type: string
        retention:
          type: string
        state:
          allOf:
            - $ref: "#/components/schemas/RunState"
          description: idle until the first object is received.
        last_key:
          type: string
        last_seen:
          type: string
          format: date-time
          description: Zero time if nothing has been received yet.
        error:
          type: string
        stale_after:
          type: string
          description: "Set only when this receiver has stale-after: configured."
        stale:
          type: boolean
          description: True once the most recent file is older than stale_after.
      required: [id, path, state, last_seen]

    ReceiverFile:
      type: object
      properties:
        key:
          type: string
        size:
          type: integer
          format: int64
        mod_time:
          type: string
          format: date-time
      required: [key, size, mod_time]

    LoginEvent:
      type: object
      properties:
        at:
          type: string
          format: date-time
        username:
          type: string
        method:
          type: string
          enum: [password, oidc]
        success:
          type: boolean
        remote_addr:
          type: string
        detail:
          type: string
          description: Failure reason; empty on success.
