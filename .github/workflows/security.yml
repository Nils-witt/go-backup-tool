name: Security

on:
  push:
    branches: [main]
  pull_request:
  # New advisories appear without any code change: re-scan weekly.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  govulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      # Set up Go (and the cache) ahead of the action, which would otherwise
      # use setup-go's shared cache key (see .github/actions/go-cache).
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: false

      - uses: ./.github/actions/go-cache
        with:
          name: govulncheck

      - uses: ./.github/actions/stub-frontend

      # The action sets up Go itself (latest stable by default, so stdlib
      # advisories for the toolchain releases are built with are reported).
      # repo-checkout: false keeps its own checkout from discarding the stub.
      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          repo-checkout: false
          cache: false

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # golangci-lint already fails the build on gosec findings; this job only
    # publishes them to the Security tab, which fork PRs can't write to.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/stub-frontend

      # gosec runs in a container, so it can't share the runner's Go caches;
      # point its module cache into the (mounted) workspace instead. The
      # leading dot keeps it out of ./... .
      - name: Cache gosec Go modules
        uses: actions/cache@v6
        with:
          path: .gomodcache
          key: gosec-gomod-${{ hashFiles('go.sum') }}
          restore-keys: gosec-gomod-

      - name: Run gosec
        uses: securego/gosec@v2.29.0
        env:
          GOMODCACHE: /github/workspace/.gomodcache
        with:
          args: -no-fail -fmt sarif -out gosec-results.sarif ./...

      - name: Upload gosec results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec-results.sarif
