name: Security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  govulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # internal/backup/webui embeds frontend/'s build output via go:embed,
      # which fails to compile without it (dist/ isn't committed, see
      # .gitignore) — govulncheck needs a buildable module to analyze.
      - name: Build dashboard frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1

  gosec:
    name: gosec
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # gosec's go/analysis-based checks need the module to compile, same
      # as govulncheck above.
      - name: Build dashboard frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Run gosec
        uses: securego/gosec@v2.29.0
        with:
          args: -no-fail -fmt sarif -out gosec-results.sarif ./...

      - name: Upload gosec results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec-results.sarif
