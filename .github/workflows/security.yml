name: Security

on:
  push:
    branches: [main]
  pull_request:
  # New advisories appear without any code change: re-scan weekly.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  govulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/stub-frontend

      # The action sets up Go itself (latest stable by default, so stdlib
      # advisories for the toolchain releases are built with are reported).
      # repo-checkout: false keeps its own checkout from discarding the stub.
      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          repo-checkout: false

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # golangci-lint already fails the build on gosec findings; this job only
    # publishes them to the Security tab, which fork PRs can't write to.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/stub-frontend

      - name: Run gosec
        uses: securego/gosec@v2.28.0
        with:
          args: -no-fail -fmt sarif -out gosec-results.sarif ./...

      - name: Upload gosec results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec-results.sarif
