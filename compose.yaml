services:
  go-backup-tool:
    # build: .
    image: ghcr.io/nils-witt/go-backup-tool:latest # use instead of build: once published
    restart: unless-stopped
    environment:
      INSTANCE_NAME: change-me-01
    volumes:
      - ./config.yaml:/data/config.yaml:ro
      - ./data:/data
      # Public keys for any recipients: in config.yaml (e.g. exported with
      # `gpg --export --armor me@example.com > keys/me.asc`) are imported
      # into the container's keychain on every startup; drop them here.
      - ./keys:/data/keys:ro
      # A "local" target's path (see config.yaml's servers:) also needs to be
      # mounted, e.g.:
      # - /mnt/backups:/mnt/backups
      # Jobs or commands with a container: run through the Docker socket.
      # Mounting it grants root-equivalent control of the host; the image
      # runs as a non-root user, so also add the socket's group (its gid on
      # the host, see `stat -c %g /var/run/docker.sock`) under group_add:.
      # - /var/run/docker.sock:/var/run/docker.sock
    # group_add:
    #   - "999"
    # Only needed if config.yaml sets listen: (enables the dashboard/receiver
    # API); leave commented out otherwise.
    ports:
      - "127.0.0.1:8080:8080"
    labels:
      autoheal-app: true
      com.centurylinklabs.watchtower.scope: ${COMPOSE_PROJECT_NAME}

  autoheal:
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal-app
    image: willfarrell/autoheal:latest
    network_mode: none
    restart: always
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock

  watchtower:
    image: nickfedor/watchtower
    volumes: [ "/var/run/docker.sock:/var/run/docker.sock" ]
    command: --interval 30 --scope ${COMPOSE_PROJECT_NAME}
    labels: [ "com.centurylinklabs.watchtower.scope=${COMPOSE_PROJECT_NAME}" ]