# Local/production compose file for go-backup-tool. Copy config.example.yaml
# to ./config.yaml first and fill in your jobs/servers (see that file for
# every option) — this compose file just wires the container up around it.
#
# go-backup-tool writes its state/retention sqlite databases next to the
# config file, so both the config and the data/ dir it lives in are mounted
# from the host: bind-mount config.yaml itself (read-only, since only the
# databases need to be written), and give it a real directory (not a named
# volume) so those .db files are easy to inspect/back up from the host too.
services:
  go-backup-tool:
    # build: .
    image: ghcr.io/nils-witt/go-backup-tool:local # use instead of build: once published
    restart: unless-stopped
    volumes:
      - ./config.yaml:/data/config.yaml:ro
      - ./data:/data
      # Public keys for any recipients: in config.yaml (e.g. exported with
      # `gpg --export --armor me@example.com > keys/me.asc`) are imported
      # into the container's keychain on every startup; drop them here.
      - ./keys:/data/keys:ro
      # A "local" target's path (see config.yaml's servers:) also needs to be
      # mounted, e.g.:
      # - /mnt/backups:/mnt/backups
    # Only needed if config.yaml sets listen: (enables the dashboard/receiver
    # API); leave commented out otherwise.
    ports:
      - "8080:8080"
