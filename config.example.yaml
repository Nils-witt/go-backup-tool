# Example go-backup-tool config file. Copy to config.yaml (or pass
# -config <path>) and fill in the values you need. This file is the only
# way to configure a job: go-backup-tool has no CLI flags for cmd, targets,
# recipients, etc. — only -config (this file's path), -job (see below), and
# -log-level (debug, info, warn, or error; default info — debug adds
# per-stage pipeline detail useful when troubleshooting a run). Log level can
# also be set via this file's top-level log-level: (see below), which
# -log-level overrides when explicitly passed.
#
# On Windows, go-backup-tool.exe can also run as a Windows service instead
# of an interactive console process:
#   go-backup-tool.exe -service=install -config C:\path\to\config.yaml
#   go-backup-tool.exe -service=start
# -service=install registers the currently running .exe, plus any other
# flags given alongside it (like -config above), as the service's command
# line; -service=stop and -service=uninstall reverse that. Once installed,
# starting the service runs it the same way as the console invocation, but
# logging to the Windows Event Log instead of the console (there isn't
# one), and it shuts down on SCM stop/shutdown requests instead of Ctrl-C.
# This is Windows-only; on other platforms -service isn't a recognized flag.
#
# Where jobs, servers, and commands are managed depends on
# webui.job-editing (see webui: below):
#
# - Off (the default): this file is the source of truth. servers:, jobs:,
#   and commands: below are read at every startup, and the web UI
#   (Settings > Jobs/Servers/Commands, admin only) only shows them.
# - On: the state db is, and admins manage them in the web UI, where changes
#   apply without a restart. Entries still listed here are imported once at
#   startup — each job with the top-level defaults below folded in — and a
#   name already stored is left alone, so web UI edits win; remove the
#   sections once imported. Switching back off later makes this file the
#   source again (what's in the state db is then ignored).
#
# gpg-bin/gpg-homedir stay top-level settings every job falls back to either
# way.
#
# Every server go-backup-tool can upload to is defined once, by name, under
# servers:. Jobs never set endpoint/path themselves — a job's targets: list
# just names which server(s) to upload to and which bucket to use on each,
# so the same server definition can be reused across many jobs.
#
# type: selects the destination kind (required; there is no default): "local"
# for a directory on the local filesystem (e.g. a mounted NFS share, external
# disk, or another backup tool's watched directory), or "remote" for another
# go-backup-tool instance's receiver API (see receivers: below). A local
# server only needs path; a target's bucket is still required and is used
# as a subdirectory under it, so the object ends up at path/bucket/key. A
# remote server only needs endpoint; a target's bucket is still required
# and is sent as the id identifying which of the destination instance's
# receivers: entries to write to. Unlike a local server, a remote server
# needs no auth field of its own: every go-backup-tool instance generates
# its own persistent RSA key pair and UUID on first run (under ./data/keys,
# next to this file) and signs each request to a remote server with it; see
# receivers: below for how the destination instance is told to trust it.
#
# A local server may also set retention: (e.g. "7d" for 7 days, "168h",
# "90m" for 90 minutes — "d" for days works alongside every unit Go's
# time.ParseDuration already supports, including "m" for minutes) to
# delete its own objects automatically once they're older than that.
# go-backup-tool tracks what it wrote in the shared state sqlite database
# kept alongside this config file (.go-backup-tool-state.db) so it only
# ever deletes objects it wrote itself; retention is swept after every
# write to that server, and once at startup. Omit retention (the default)
# to keep objects forever.
# A remote server has no retention: of its own — that's configured on the
# destination instance's matching receivers: entry instead.
#
# A job's own targets: entry may set retention: too (same syntax, local
# servers only), overriding the server's retention: for that job's writes
# to that target — handy when several jobs share one local server but need
# different retention windows (see the "uploads" job's nas target below).
# Leave it unset to keep the server's retention: unchanged.
servers:
  - name: nas
    type: local
    path: /mnt/backups
    retention: 7d # delete objects here once they're older than 7 days
  - name: sibling-instance
    type: remote
    endpoint: "https://backup2.example.com:8443"
    # No auth field here: this instance authenticates to the destination
    # with its own generated identity (see above). Give the destination
    # instance's operator this instance's server ID and public key (both on
    # the web UI's Identity page; also ./data/keys/server.uuid and
    # server.pub) to add as a trusted server there (Trusted servers, admin
    # only) and allow on the matching receiver.

# Every job is defined under jobs:, one entry per backup; run all jobs
# with no -job flag, or one with -job <name> (with webui.job-editing, any
# stored job, including ones created in the web UI). Every key below is
# optional and falls back to a built-in default. Any key may also be set at
# the top level, alongside jobs:, to act as a shared default every job
# inherits and can override. timeout applies to the whole run (every job),
# not per job.
#
# A job's backup is encrypted and written to a local staging file (see
# staging-dir below) before any target upload starts, so a failed source
# command or gpg never reaches a target, and each target then uploads from
# that same stable file independently. Each target gets exactly one upload
# attempt; a target whose upload fails is not retried, and that failure is
# permanent for the run — it never affects any other target's own attempt.
#
# staging-dir: "" # directory the encrypted backup is staged to before
# uploading; empty (the default) uses the OS temp directory. Set this if
# the default temp filesystem is too small or too slow for your backups'
# size (e.g. point it at the same volume a large local target already
# lives on).

# gpg-bin and gpg-homedir are almost always set here, at the top level,
# rather than per job: they describe where gpg lives on this machine, not
# anything about an individual backup. gpg-bin (default "gpg") is the gpg
# binary to invoke, handy if it isn't on PATH or you want a specific
# version. gpg-homedir (default: gpg's own default, usually ~/.gnupg)
# points gpg at a specific keyring directory, e.g. one dedicated to this
# service account rather than whichever user runs go-backup-tool.
# gpg-bin: gpg
# gpg-homedir: ""

# timeout: 30m # applies to the whole run (every job), not per job

# log-level: info # debug, info, warn, or error (default info); the
# -log-level flag overrides this when explicitly given on the command line.

# log-file: data/go-backup-tool.log # if set, log output is also appended to
# this file (created, along with its directory, if missing), in addition to
# stderr (or the Windows Event Log when running as a service). Unset (the
# default) disables file logging.

# keys-dir: data/keys # where this instance's persistent identity (RSA key
# pair + UUID, generated on first run — see type: remote above) is stored.
# Defaults to ./data/keys, next to this file.

# server-name identifies this instance in notifications: (see below) — a
# {server_name} placeholder, substituted the same way as a stale/download
# notification's other placeholders or a report notification's, is
# available in every notification webhook.body/email.subject/email.body.
# Handy for telling which go-backup-tool instance a notification came from
# when several instances share the same webhook/inbox. It's also shown on
# the web UI's login page and app bar (see webui: below) to tell instances
# apart; if unset there, the dashboard falls back to the INSTANCE_NAME
# environment variable. Omit to leave it "".
# server-name: primary-backup-host

# webui: configures the optional web UI dashboard (http://host:port/),
# showing every job's and target's live status (idle/running/ok/failed, last
# run time, duration, error), and — since it's served by the same HTTP
# server — the receiver API used by any type: remote targets: (see
# receivers: below). Omit this section entirely (the default) to disable
# the web UI. When enabled, the process stays alive to keep serving the
# dashboard even after every job has finished its (possibly one-shot) run,
# until stopped (Ctrl-C/SIGTERM) or the config file's timeout elapses.
# webui:
#   enabled: true
#   listen: ":8080" # required when enabled: true
#
#   # The dashboard's only login method is SSO (see oidc below): every
#   # /api/... endpoint — including minting a per-receiver file download
#   # ticket — needs a signed-in SSO user. Without oidc enabled, nobody can
#   # sign in and the dashboard stays locked; the receiver API (used by
#   # other go-backup-tool instances, not browsers) is unaffected either
#   # way, since it authenticates each request with its own per-receiver
#   # public-key-verified JSON Web Token.
#
#   # log-viewer adds a "Logs" section to the dashboard, showing this
#   # process's own recent log output (polled from /api/logs) to every user
#   # with "view". Unset (the default) leaves it off, since raw log output
#   # may include detail (paths, error text) not meant for every viewer.
#   log-viewer: true
#
#   # event-log-limit caps how many of the most recent entries each event
#   # log (job runs, target runs, logins, downloads, receiver events) shows
#   # in the dashboard. Every entry stays in the state database regardless.
#   # Unset defaults to 200; must be between 1 and 10000.
#   event-log-limit: 1000
#
#   # trust-proxy-headers makes the dashboard's login/download logs and
#   # access log record the client address from the Forwarded/
#   # X-Forwarded-For/X-Real-Ip request headers instead of the raw TCP
#   # connection's address. Only enable this when a reverse proxy sits in
#   # front of every request and itself sets these headers (stripping any
#   # client-supplied copies first) — otherwise a client can spoof its own
#   # logged address. Unset (the default) always uses the TCP connection's
#   # own address. It also makes the live status WebSocket accept the
#   # public host from Forwarded host=/X-Forwarded-Host as its origin, for a
#   # proxy that rewrites Host (e.g. to 127.0.0.1:8086).
#   trust-proxy-headers: true
#
#   # dev-mode adds permissive CORS response headers (Access-Control-Allow-
#   # Origin: *) to every response, so a frontend dev server on its own
#   # origin (e.g. `npm run dev`, http://localhost:5173) can call this
#   # instance's /api/... endpoints directly. Unset (the default) adds no
#   # CORS headers. Never enable this against a production instance: it lets
#   # any website's JavaScript read API responses from a browser that also
#   # holds a valid bearer token for this instance.
#   dev-mode: true
#
#   # cors-get-origins enables CORS for the read-only GET /api/... endpoints
#   # only, so another site's JavaScript (e.g. a status page) can read this
#   # instance's API with its own bearer token (an API token from the
#   # dashboard) — e.g. another instance's dashboard showing this one under
#   # "Remote backends". List bare origins (scheme://host[:port]) or "*" for any
#   # origin. POST/PUT/DELETE stay same-origin only. Unset (the default)
#   # adds no CORS headers; dev-mode, if set, takes precedence.
#   cors-get-origins:
#     - "https://status.example.com"
#
#   # receivers-base-dir is the directory every receiver path set from the
#   # web UI (Receiver settings) must lie inside, so a dashboard admin can't
#   # point a receiver at an arbitrary location on this machine; symlinks
#   # leading outside it are rejected too. Must be absolute. Unset (the
#   # default) leaves the web UI unable to create receivers or change their
#   # path (other fields can still be edited).
#   receivers-base-dir: /mnt/remote-backups
#
#   # job-editing moves jobs, servers, and commands from this file into the
#   # state db, where dashboard admins create, change, and delete them
#   # (Settings > Jobs/Servers/Commands); see servers: above. Unset (the
#   # default) keeps them in this file, shown read-only in the dashboard. A
#   # job's cmd and a command's cmd run as shell commands on this machine,
#   # and a local server's path is written to, so enabling this lets every
#   # admin run arbitrary commands as this process's user — only enable it
#   # if that's acceptable for everyone granted "admin".
#   # It also lets admins add public keys to the GPG keyring (Settings >
#   # GPG keys; listing them is always allowed): a key carrying a
#   # recipient's email address could otherwise receive that job's backups.
#   job-editing: true
#
#   # oidc configures single sign-on via an OpenID Connect provider
#   # (Keycloak, Authentik, Okta, ...). The dashboard itself is the OIDC
#   # client: a public client running authorization code + PKCE in the
#   # browser, with no client secret. Register it with the provider as a
#   # public/SPA client, with this instance's own address plus
#   # /login/sso/callback as its redirect URI (e.g.
#   # https://backups.example.com/login/sso/callback) and that origin
#   # allowed for CORS. Every API request then carries the provider's access
#   # token, which this instance verifies against the issuer's keys.
#   # Changing anything here needs a restart.
#   oidc:
#     enabled: true
#     issuer: "https://auth.example.com/realms/main"
#     client-id: "go-backup-tool"
#     # scopes the browser requests. Unset defaults to [openid, profile,
#     # email]. Add offline_access to get a refresh token: without one, a
#     # session ends as soon as its access token expires.
#     scopes: [openid, profile, email, offline_access]
#     # button-label: "Sign in with SSO"
#     # groups-claim names the access-token claim listing the user's groups
#     # (a string array or a single string). Default "groups".
#     # groups-claim: groups
#     #
#     # Permissions are never stored: they're worked out from the access
#     # token on every request, so changing someone's groups at the provider
#     # applies on their next request. Available permissions: "view" (see
#     # job/target/receiver status, file listings, and application logs),
#     # "download" (also pull a file's actual content; implies "view"),
#     # "login-log", "download-log", "job-run-log", "target-run-log",
#     # "receiver-log" (each one history view, granted independently of
#     # "view"), and "admin" (also retry a job's failed targets; implies all
#     # of the above).
#     #
#     # default-permissions is granted to every signed-in user. Unset
#     # defaults to [view, download].
#     # default-permissions: [view, download]
#     # group-permissions maps a group name (as it appears in groups-claim)
#     # to what its members get on top of default-permissions.
#     group-permissions:
#       backup-admins: [admin]
#       auditors: [login-log, download-log]

jobs:
  - name: database
    cmd: "mysqldump --single-transaction mydb | gzip"
    # container (optional) runs cmd inside that already-running container
    # (name or id) through the Docker daemon (see docker-socket: below)
    # instead of on this machine — e.g. to dump a database whose client
    # tools only exist in its own image. cmd runs via "sh -c" there, so the
    # container needs a sh; its stdout is the backup, as for a local cmd:.
    # container-user (optional, user[:group]) overrides the container's
    # default user. Canceling a run (the config file's timeout:) stops
    # reading the output, but Docker can't kill an exec'd process: it keeps
    # running inside the container until it exits.
    # container: mariadb
    # container-user: mysql
    key: "db-{time}.gpg"
    targets:
      - server: nas
        bucket: my-backup-bucket
    recipients:
      - me@example.com
    # armor: false
    # gpg-bin: gpg
    # gpg-homedir: ""
    # failure-notifications (optional) names notifications (by id, as
    # managed in the web UI — see notifications: below) to fire whenever
    # this job's run ends in an error on any target — every target failing
    # or just some. An id that doesn't exist is logged at startup and
    # skipped when firing. Accepts the {job}, {error}, {state} ("failed"
    # or "incomplete"), {duration}, {started_at} (RFC 3339), and
    # {server_name} placeholders in a notification's
    # webhook.body/email.subject/email.body.
    # failure-notifications: [pagerduty]
    interval: 6h # this job repeats every 6h; go-backup-tool keeps running instead of exiting
    # start-time: "2026-01-01T03:00:00Z" # anchors the repeat grid: with
    # interval: 6h set, runs land at 03:00, 09:00, 15:00, 21:00 UTC every
    # day, not just "whenever 6h have passed since the process started".
    # Requires interval: to also be set. Every schedule is UTC-based: an
    # RFC 3339 time with another offset is accepted but converted to UTC.
    # Each job's last successful run is
    # tracked in a small sqlite database next to this config file
    # (.go-backup-tool-state.db), so if go-backup-tool was down through one
    # or more of these times, it catches up with a single run on the next
    # startup, then resumes the correctly aligned grid — it won't replay
    # every individually missed slot.
  - name: uploads
    cmd: "tar czf - /srv/uploads"
    key: "uploads-{time}.gpg"
    recipients:
      - me@example.com
    # A job may upload the same backup to more than one server by listing
    # more than one entry under targets:. Every target uploads the same
    # encrypted object (same key), so only the server and bucket differ.
    # A local server works the same way (see "nas" above): the object is
    # written to /mnt/backups/my-backup-bucket-local/uploads-<time>.gpg. A
    # remote server (see "sibling-instance" above) sends bucket as the id
    # naming which of the destination instance's receivers: entries to
    # write to.
    targets:
      - server: nas
        bucket: my-backup-bucket-local
        retention: 30d # overrides nas's own 7d retention: for this job only
        # on-error (optional) names a top-level commands: entry (see
        # commands: below) to run once this target has failed on-error.after
        # times in a row — and again on every consecutive failure after
        # that, until a success resets the streak. Set repeat: false to fire
        # only once per streak, when it first reaches after. The streak is
        # tracked in memory only and resets when go-backup-tool restarts.
        # on-error:
        #   command: restart-nas-mount
        #   after: 3
        #   repeat: true # default
        # on-recover (optional) names a commands: entry to run once, on the
        # first success after one or more consecutive failures of this
        # target (independent of on-error.after).
        # on-recover:
        #   command: resolve-oncall
      - server: sibling-instance
        bucket: from-primary # = id of a receivers: entry on sibling-instance
    # no interval: this job runs once and doesn't repeat, even though
    # "database" above keeps the whole process alive

# receivers: is DEPRECATED. Receivers — the destination side of another
# go-backup-tool instance's type: remote target above — are managed in the
# web UI now (Receiver settings, admin only), stored in the state db, and
# take effect immediately without a restart. Any receivers: entries still
# listed here are imported into the state db once at startup (an id already
# stored is left alone, so web UI edits win) and a warning is logged; remove
# the section once imported. The receiver API is only reachable when
# webui.enabled: true is set (it's served by the same HTTP server as the
# dashboard), and receiver paths set from the web UI must lie inside
# webui.receivers-base-dir: (see webui: above).
#
# Each receiver's id is what a sender's target names as its bucket;
# public-key must be the sending instance's own public key — the contents
# of that instance's ./data/keys/server.pub (see "sibling-instance" above) —
# so this instance can verify the JSON Web Token every request from it is
# signed with, instead of a shared secret (imported receivers accept it
# alongside any trusted servers later allowed on them in the web UI, which
# replace it); path is the root directory
# incoming objects for this id are written under (object ends up at
# path/key, mirroring a local server's path/bucket/key); retention
# (optional, same syntax as a local server's) deletes objects here once
# they're older than that.
#
# stale-after and stale-notifications (optional, set together) monitor this
# receiver for a sender that's stopped showing up: once at least one file has
# been received under path, if the most recent one is older than stale-after
# (same duration syntax as retention), go-backup-tool fires every
# notifications: entry named in stale-notifications (see notifications:
# below). A receiver that has never received anything at all never fires —
# there's no file to be stale — so this only alerts on a sender that
# stopped, not one that never started. It's checked about once a minute and
# fires once per gap, not on every check — a fresh file resets it so it can
# fire again on the next gap.
#
# download-notifications (optional, independent of stale-after/
# stale-notifications) names notifications: entries to fire every time a
# file is successfully downloaded from this receiver through the dashboard.
#
# Both accept the {receiver_id}, {path}, {stale_after}, {last_received} (an
# RFC 3339 timestamp) placeholders (stale-notifications) or {user}, {file},
# {receiver}, {time} (an RFC 3339 timestamp) placeholders
# (download-notifications) in a notification's webhook.body/email.subject/
# email.body — see notifications: below.
# receivers:
#   - id: from-primary
#     public-key: |
#       -----BEGIN PUBLIC KEY-----
#       ...paste sibling-instance's own data/keys/server.pub here...
#       -----END PUBLIC KEY-----
#     path: /mnt/remote-backups/from-primary
#     retention: 30d
#     stale-after: 26h # alert if sibling-instance's daily job hasn't shown up
#     stale-notifications: [pagerduty]
#     download-notifications: [slack-downloads]

# A job's key keeps its {time} placeholder each time it (re-)runs, so a
# repeating job gets a fresh object on every run instead of overwriting the
# last one; go-backup-tool warns at startup if a repeating job's key has no
# {time} placeholder at all.

# smtp: is the outgoing mail server used by any notification with an email
# channel (see notifications: below). It stays in this file — it isn't
# configurable in the web UI — and changing it needs a restart. Omit
# entirely if no notification uses email.
# smtp:
#   host: "smtp.example.com"
#   # port: 587 # default 587, or 465 if security: tls
#   username: "backups@example.com"
#   # password/password-env are mutually exclusive — set at most one,
#   # together with username; omit all three to send unauthenticated (e.g.
#   # a trusted local relay). password writes the credential directly in
#   # this file; password-env instead names an environment variable to
#   # read it from instead.
#   password: "app-password-here"
#   # password-env: SMTP_PASSWORD
#   # security selects the connection's encryption: "starttls" (the
#   # default) connects in plaintext and upgrades before authenticating;
#   # "tls" connects already encrypted (the traditional port 465); "none"
#   # never encrypts, for a trusted local relay only.
#   security: starttls

# notifications: is DEPRECATED. Notifications are managed in the web UI now
# (Settings > Notifications, admin only), stored in the state db, and edits
# apply immediately without a restart. Any entries still listed here are
# imported into the state db once at startup (an id already stored is left
# alone, so web UI edits win) and a warning is logged; remove the section
# once imported. A notification can't be deleted in the web UI while a job,
# receiver, or the report still references it. Webhook header values are
# write-only there: they're never shown again after saving. The format
# below is what the import reads.
#
# notifications: are named, reusable webhook/email destinations, referenced
# by id from report.notifications: below and a receivers: entry's
# stale-notifications:/download-notifications: above. Each entry needs at
# least one of webhook: or email: — set both to fire both channels for that
# id. webhook.url is the only required field; webhook.method defaults to
# POST, webhook.headers (optional) is a map of header name to value, and
# webhook.body (optional) is the request body — if unset, it defaults to a
# JSON summary of whatever fired it. email.to is the only required field;
# email.from defaults to smtp.username, and email.subject/email.body
# (optional) default to the firing trigger's own text — set them to
# override with the same {placeholder} syntax webhook.body accepts. Every
# trigger's placeholders (stale/download/report, see receivers: and report:
# below) also include {server_name}, this instance's top-level server-name:
# (see above), "" if unset.
#
# email.encrypt (optional) GPG-encrypts that email's body as OpenPGP/MIME
# (RFC 3156) before sending, so a notification's contents (which may include
# receiver/download detail) aren't readable in transit or sitting in an
# inbox provider — only the subject line stays in the clear, since SMTP/MIME
# headers are never covered by this. encrypt.recipients names the GPG
# identities (fingerprint or email address) to encrypt to; each must already
# have its public key imported into the keyring the top-level
# gpg-bin/gpg-homedir (see above) resolve to (`gpg --import their-key.asc`) —
# encrypted emails use the same gpg binary and keyring as backups.
# notifications:
#   - id: ops-email
#     email:
#       to: ["ops@example.com"]
#   - id: ops-email-encrypted
#     email:
#       to: ["ops@example.com"]
#       encrypt:
#         recipients: ["ops@example.com"]
#   - id: pagerduty
#     webhook:
#       url: "https://events.eu.pagerduty.com/v2/enqueue"
#       method: POST
#       headers:
#         Content-Type: application/json
#       body: '{"payload":{"summary":"from-primary backup stale, last file {last_received}","severity":"critical","source":"go-backup-tool"},"routing_key":"replace-with-your-pagerduty-routing-key","event_action":"trigger"}'
#   - id: slack-downloads
#     webhook:
#       url: "https://hooks.slack.com/services/replace-with-your-webhook-path"
#       body: '{"text":"{user} downloaded {file} from {receiver} at {time}"}'

# docker-socket is the Docker daemon a job's or command's container: runs
# through: a Unix socket path (optionally written unix:///path) or a
# plain-HTTP tcp://host:port (TLS-protected daemons aren't supported).
# Unset falls back to the DOCKER_HOST environment variable, then
# /var/run/docker.sock. Podman's Docker-compatible socket works too. Access
# to the Docker socket is root-equivalent on that host — a socket proxy that
# only allows the exec endpoints (POST /containers/{id}/exec, POST
# /exec/{id}/start, GET /exec/{id}/json) narrows that.
# docker-socket: /var/run/docker.sock

# commands: are named, reusable shell commands, referenced by id from a job
# target's on-error.command or on-recover.command (see targets: above) — the
# same "define once, reference by id" shape as notifications: above. id is
# required and must be unique; cmd is required and is run through the
# platform shell exactly like a job's own cmd: (sh -c on Linux/macOS, cmd /C on Windows) — it's
# operator-supplied config, not sanitized in any way. timeout (optional,
# same duration syntax as retention:) bounds how long one firing may run;
# defaults to 30s. container/container-user (optional) run cmd inside a
# container instead, exactly like a job's own container: does; the GBT_*
# variables below are then added to the container's environment.
#
# Context is passed to the command via environment variables (never
# interpolated into the command string, so you never have to worry about an
# error message containing shell metacharacters): GBT_EVENT ("error" or
# "recover"), GBT_JOB, GBT_TARGET (the target's bucket), GBT_SERVER (its
# server name), GBT_ERROR (on-error only; unset on recovery),
# GBT_CONSECUTIVE_FAILURES (the streak length that triggered this firing, see
# on-error.after above — or, for on-recover, the streak that just ended), and
# GBT_TIME (RFC 3339).
# commands:
#   - id: restart-nas-mount
#     cmd: "ssh nas-host systemctl restart nas-share"
#     timeout: 15s
#   - id: page-oncall
#     cmd: "curl -fsS -X POST https://events.example.com/trigger -d \"target=$GBT_TARGET&error=$GBT_ERROR\""
#   - id: restart-app
#     cmd: "kill -HUP 1"
#     container: my-app
#   - id: resolve-oncall
#     cmd: "curl -fsS -X POST https://events.example.com/resolve -d \"target=$GBT_TARGET&failures=$GBT_CONSECUTIVE_FAILURES\""

# report: is DEPRECATED. The report is configured in the web UI now
# (Settings > Report, admin only), stored in the state db, and a changed
# schedule applies immediately. A report: section still here is imported
# into the state db once, only if none is stored yet, and a warning is
# logged; remove it once imported.
#
# report: configures an optional summary of this instance's receiver
# activity: how many files each configured receivers: entry received since
# the previous report, any receiver API errors, and any receiver currently
# stale (see receivers: above). Independent of webui: — it's sent regardless
# of whether the dashboard is enabled, as long as at least one receivers:
# entry exists to report on. Omit this section entirely (the default) to
# disable it.
# report:
#   enabled: true
#   # schedule: a standard 5-field cron expression (minute hour
#   # day-of-month month day-of-week), always evaluated in UTC regardless
#   # of this machine's time zone (a CRON_TZ=/TZ= prefix is rejected); also
#   # accepts cron's descriptor shorthands (e.g. "@daily", "@every 6h").
#   # Default "0 7 * * *" (once a day at 07:00 UTC).
#   schedule: "0 7 * * *"
#   # notifications: names notifications: entries (see above) to send this
#   # report to. An email: channel receives the full report as its body,
#   # with its subject: (default "go-backup-tool report - {end}")
#   # substituted the same way a stale/download notification's placeholders
#   # are — {start}/{end} are the report window's bounds in UTC, formatted
#   # "2006-01-02 15:04"; {receivers}, {errors}, {stale}, {jobs}, and
#   # {job-errors} are counts of each section. A webhook: channel receives a
#   # JSON summary of the same counts, or its own body: template.
#   notifications: [ops-email]
